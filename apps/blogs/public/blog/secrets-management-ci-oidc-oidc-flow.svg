<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7FB"/>
      <stop offset="1" stop-color="#EDEDF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#16A34A"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#D97706"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2F5BFF"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <g opacity="0.45" stroke="#D8D8E8" stroke-width="2">
    <path d="M0 112H1200M0 224H1200M0 336H1200M0 448H1200M0 560H1200"/>
    <path d="M120 0V675M264 0V675M408 0V675M552 0V675M696 0V675M840 0V675M984 0V675M1128 0V675"/>
  </g>

  <text x="40" y="62" fill="#111827" font-size="34" font-weight="800">GitHub Actions to AWS with OIDC</text>
  <text x="40" y="98" fill="#4B5563" font-size="18">Each run proves who it is with a short-lived signed token. The role's trust policy decides.</text>

  <!-- github oidc provider -->
  <g filter="url(#shadow)">
    <rect x="40" y="140" width="380" height="100" rx="22" fill="white" stroke="#E5E7EF" stroke-width="2"/>
  </g>
  <text x="230" y="182" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">GitHub OIDC provider</text>
  <text x="230" y="212" text-anchor="middle" fill="#4B5563" font-size="16">token.actions.githubusercontent.com</text>

  <!-- nothing stored pill -->
  <rect x="460" y="162" width="360" height="56" rx="28" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="640" y="196" text-anchor="middle" fill="#16A34A" font-size="17" font-weight="700">No cloud keys stored in GitHub</text>

  <!-- job -->
  <g filter="url(#shadow)">
    <rect x="40" y="330" width="300" height="150" rx="22" fill="white" stroke="#2F5BFF" stroke-width="2.5"/>
  </g>
  <text x="64" y="368" fill="#111827" font-size="21" font-weight="700">GitHub Actions job</text>
  <text x="64" y="398" fill="#4B5563" font-size="16">acme/web · deploy.yml</text>
  <text x="64" y="424" fill="#4B5563" font-size="16">environment: production</text>
  <text x="64" y="450" fill="#4B5563" font-size="16">id-token: write</text>

  <!-- sts -->
  <g filter="url(#shadow)">
    <rect x="500" y="330" width="280" height="150" rx="22" fill="white" stroke="#D97706" stroke-width="2.5"/>
  </g>
  <text x="640" y="374" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">AWS STS</text>
  <text x="640" y="404" text-anchor="middle" fill="#4B5563" font-size="16">AssumeRoleWithWebIdentity</text>
  <text x="640" y="430" text-anchor="middle" fill="#4B5563" font-size="16">role: gha-web-deploy-prod</text>

  <!-- trust policy -->
  <g filter="url(#shadow)">
    <rect x="860" y="140" width="300" height="340" rx="22" fill="white" stroke="#2F5BFF" stroke-width="2.5"/>
  </g>
  <text x="884" y="180" fill="#111827" font-size="20" font-weight="700">Role trust policy</text>
  <text x="884" y="208" fill="#4B5563" font-size="16">all of these must hold</text>
  <circle cx="892" cy="246" r="6" fill="#16A34A"/>
  <text x="908" y="252" fill="#111827" font-size="16">signed by GitHub (JWKS)</text>
  <circle cx="892" cy="286" r="6" fill="#16A34A"/>
  <text x="908" y="292" fill="#111827" font-size="16">iss = token.actions…</text>
  <circle cx="892" cy="326" r="6" fill="#16A34A"/>
  <text x="908" y="332" fill="#111827" font-size="16">aud = sts.amazonaws.com</text>
  <circle cx="892" cy="366" r="6" fill="#16A34A"/>
  <text x="908" y="372" fill="#111827" font-size="16">sub = repo:acme/web:</text>
  <text x="908" y="396" fill="#111827" font-size="16">environment:production</text>
  <circle cx="892" cy="436" r="6" fill="#16A34A"/>
  <text x="908" y="442" fill="#111827" font-size="16">token not expired</text>

  <!-- deny -->
  <g filter="url(#shadow)">
    <rect x="860" y="520" width="300" height="120" rx="22" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  </g>
  <text x="884" y="558" fill="#DC2626" font-size="19" font-weight="700">Anything else: AccessDenied</text>
  <text x="884" y="588" fill="#4B5563" font-size="16">other repo or branch, fork PR,</text>
  <text x="884" y="612" fill="#4B5563" font-size="16">a different environment</text>

  <!-- cloud resources -->
  <g filter="url(#shadow)">
    <rect x="500" y="540" width="280" height="100" rx="22" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.5"/>
  </g>
  <text x="640" y="582" text-anchor="middle" fill="#111827" font-size="21" font-weight="700">S3 · CloudFront</text>
  <text x="640" y="612" text-anchor="middle" fill="#4B5563" font-size="16">only what the role allows</text>

  <!-- 1: job -> provider -->
  <path d="M120 328V246" stroke="#2F5BFF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <text x="108" y="294" text-anchor="end" fill="#2F5BFF" font-size="16" font-weight="600">1 ask</text>

  <!-- 2: provider -> job -->
  <path d="M250 242V324" stroke="#2F5BFF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <text x="264" y="294" fill="#2F5BFF" font-size="16" font-weight="600">2 signed JWT</text>

  <!-- 3: job -> sts -->
  <path d="M342 380H494" stroke="#D97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowAmber)"/>
  <text x="420" y="368" text-anchor="middle" fill="#D97706" font-size="16" font-weight="600">3 JWT + role</text>

  <!-- 4: sts -> trust -->
  <path d="M782 405H854" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="818" y="393" text-anchor="middle" fill="#4B5563" font-size="16" font-weight="600">4 check</text>

  <!-- 5: sts -> job creds -->
  <path d="M498 445H346" stroke="#16A34A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <text x="420" y="470" text-anchor="middle" fill="#16A34A" font-size="16" font-weight="600">5 creds, ~1 h</text>

  <!-- 6: job -> resources -->
  <path d="M190 482V590H494" stroke="#16A34A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
  <text x="206" y="560" fill="#16A34A" font-size="16" font-weight="600">6 deploy with temporary credentials</text>

  <!-- trust -> deny -->
  <path d="M1010 482V514" stroke="#DC2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowRed)"/>
</svg>
