<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="title description"><title id="title">Incremental Markdown: stable blocks and a live tail</title><desc id="description">Completed Markdown blocks are parsed once and memoized. Only the changing tail is lexed and rendered again each animation frame. Completed tail blocks become part of the stable prefix.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F7F7FB"/><stop offset="1" stop-color="#EDEDF7"/></linearGradient><marker id="2F5BFF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F5BFF"/></marker><marker id="16A34A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16A34A"/></marker><marker id="DC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker><marker id="D97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><g opacity="0.4" stroke="#D8D8E8"><path d="M0 168H1200M0 336H1200M0 504H1200M200 0V675M400 0V675M600 0V675M800 0V675M1000 0V675"/></g><text x="40" y="61" fill="#111827" font-size="31" font-weight="800" text-anchor="start">Incremental Markdown: stable blocks and a live tail</text><text x="40" y="95" fill="#4B5563" font-size="18" font-weight="400" text-anchor="start">Avoid parsing and highlighting the entire response on every token.</text><rect x="40" y="150" width="1120" height="100" rx="20" fill="#EEF2FF" stroke="#2F5BFF" stroke-width="2"/><text x="62" y="187" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Accumulated Markdown</text><text x="62" y="219" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">A stable prefix of completed blocks + a changing tail</text><rect x="40" y="320" width="330" height="150" rx="20" fill="#ECFDF3" stroke="#16A34A" stroke-width="2"/><text x="62" y="357" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Completed block 1</text><text x="62" y="389" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Paragraph or code block</text><text x="62" y="416" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Parse and highlight once</text><text x="62" y="443" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Memoized render</text><rect x="395" y="320" width="330" height="150" rx="20" fill="#ECFDF3" stroke="#16A34A" stroke-width="2"/><text x="417" y="357" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Completed block 2</text><text x="417" y="389" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Keep the original raw text</text><text x="417" y="416" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Preserve the stable boundary</text><text x="417" y="443" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Memoized render</text><rect x="750" y="320" width="410" height="150" rx="20" fill="#FFF7ED" stroke="#D97706" stroke-width="2"/><text x="772" y="357" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Changing tail</text><text x="772" y="389" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Lex only after the stable boundary</text><text x="772" y="416" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Close an incomplete fence for display</text><text x="772" y="443" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Render without syntax highlighting</text><path d="M205 250V312" stroke="#16A34A" stroke-width="3" fill="none" marker-end="url(#16A34A)"/><path d="M560 250V312" stroke="#16A34A" stroke-width="3" fill="none" marker-end="url(#16A34A)"/><path d="M955 250V312" stroke="#D97706" stroke-width="3" fill="none" marker-end="url(#D97706)"/><path d="M955 470V525H1120V478" stroke="#D97706" stroke-width="3" fill="none" marker-end="url(#D97706)"/><text x="1022" y="558" fill="#D97706" font-size="18" font-weight="600" text-anchor="middle">Next animation frame</text><text x="40" y="536" fill="#111827" font-size="20" font-weight="600" text-anchor="start">Promote a finished tail block into the stable prefix.</text><text x="40" y="572" fill="#4B5563" font-size="18" font-weight="400" text-anchor="start">Append new text to the tail; do not reparse the whole response.</text><text x="40" y="635" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Stable prefix: unchanged DOM. Changing tail: bounded rendering work.</text></svg>
