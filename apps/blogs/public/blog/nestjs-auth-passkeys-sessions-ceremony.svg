<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="title description"><title id="title">Passkeys: registration and authentication</title><desc id="description">Registration creates a key pair and stores the public key on the server. Authentication signs a one-use challenge. The server validates challenge, origin, relying party ID and signature before creating a session.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F7F7FB"/><stop offset="1" stop-color="#EDEDF7"/></linearGradient><marker id="2F5BFF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F5BFF"/></marker><marker id="16A34A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16A34A"/></marker><marker id="DC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker><marker id="D97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><g opacity="0.4" stroke="#D8D8E8"><path d="M0 168H1200M0 336H1200M0 504H1200M200 0V675M400 0V675M600 0V675M800 0V675M1000 0V675"/></g><text x="40" y="61" fill="#111827" font-size="31" font-weight="800" text-anchor="start">Passkeys: registration and authentication</text><text x="40" y="95" fill="#4B5563" font-size="18" font-weight="400" text-anchor="start">Two WebAuthn ceremonies between the browser, authenticator and server.</text><rect x="40" y="148" width="535" height="420" rx="20" fill="white" stroke="#2F5BFF" stroke-width="2"/><text x="62" y="185" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Registration: create a credential</text><rect x="625" y="148" width="535" height="420" rx="20" fill="white" stroke="#16A34A" stroke-width="2"/><text x="647" y="185" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Authentication: prove possession</text><circle cx="87" cy="230" r="17" fill="#2F5BFF"/><text x="87" y="236" fill="white" font-size="17" font-weight="700" text-anchor="middle">1</text><text x="116" y="236" fill="#111827" font-size="18" font-weight="500" text-anchor="start">Server creates a short-lived challenge</text><circle cx="87" cy="305" r="17" fill="#2F5BFF"/><text x="87" y="311" fill="white" font-size="17" font-weight="700" text-anchor="middle">2</text><text x="116" y="311" fill="#111827" font-size="18" font-weight="500" text-anchor="start">Browser asks authenticator to create a key</text><circle cx="87" cy="380" r="17" fill="#2F5BFF"/><text x="87" y="386" fill="white" font-size="17" font-weight="700" text-anchor="middle">3</text><text x="116" y="386" fill="#111827" font-size="18" font-weight="500" text-anchor="start">Authenticator keeps the private key</text><circle cx="87" cy="455" r="17" fill="#2F5BFF"/><text x="87" y="461" fill="white" font-size="17" font-weight="700" text-anchor="middle">4</text><text x="116" y="461" fill="#111827" font-size="18" font-weight="500" text-anchor="start">Server verifies response; stores public key</text><circle cx="672" cy="230" r="17" fill="#16A34A"/><text x="672" y="236" fill="white" font-size="17" font-weight="700" text-anchor="middle">1</text><text x="701" y="236" fill="#111827" font-size="18" font-weight="500" text-anchor="start">Server creates a fresh, one-use challenge</text><circle cx="672" cy="305" r="17" fill="#16A34A"/><text x="672" y="311" fill="white" font-size="17" font-weight="700" text-anchor="middle">2</text><text x="701" y="311" fill="#111827" font-size="18" font-weight="500" text-anchor="start">User authorizes the authenticator</text><circle cx="672" cy="380" r="17" fill="#16A34A"/><text x="672" y="386" fill="white" font-size="17" font-weight="700" text-anchor="middle">3</text><text x="701" y="386" fill="#111827" font-size="18" font-weight="500" text-anchor="start">Authenticator signs; browser binds origin</text><circle cx="672" cy="455" r="17" fill="#16A34A"/><text x="672" y="461" fill="white" font-size="17" font-weight="700" text-anchor="middle">4</text><text x="701" y="461" fill="#111827" font-size="18" font-weight="500" text-anchor="start">Server verifies response; creates session</text><text x="72" y="525" fill="#2F5BFF" font-size="18" font-weight="600" text-anchor="start">Stored: credential ID + public key + metadata</text><text x="657" y="525" fill="#16A34A" font-size="18" font-weight="600" text-anchor="start">Check: challenge + origin + RP ID + signature</text><text x="600" y="624" fill="#111827" font-size="20" font-weight="600" text-anchor="middle">The private key stays with the authenticator; the server stores no password.</text></svg>
