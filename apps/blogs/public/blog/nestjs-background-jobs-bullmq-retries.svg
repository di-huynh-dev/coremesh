<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7FB"/>
      <stop offset="1" stop-color="#EDEDF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#16A34A"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#D97706"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2F5BFF"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <g opacity="0.45" stroke="#D8D8E8" stroke-width="2">
    <path d="M0 112H1200M0 224H1200M0 336H1200M0 448H1200M0 560H1200"/>
    <path d="M120 0V675M264 0V675M408 0V675M552 0V675M696 0V675M840 0V675M984 0V675M1128 0V675"/>
  </g>

  <text x="40" y="62" fill="#111827" font-size="34" font-weight="800">Job states, retries and dead letters</text>
  <text x="40" y="98" fill="#4B5563" font-size="18">Classified errors pick the path. Only real failures use up an attempt.</text>

  <!-- waiting -->
  <g filter="url(#shadow)">
    <rect x="40" y="210" width="200" height="100" rx="22" fill="white" stroke="#E5E7EF" stroke-width="2"/>
  </g>
  <text x="140" y="254" text-anchor="middle" fill="#111827" font-size="24" font-weight="700">waiting</text>
  <text x="140" y="286" text-anchor="middle" fill="#4B5563" font-size="18">ready to fetch</text>

  <!-- active -->
  <g filter="url(#shadow)">
    <rect x="420" y="210" width="240" height="100" rx="22" fill="white" stroke="#2F5BFF" stroke-width="2.5"/>
  </g>
  <text x="540" y="254" text-anchor="middle" fill="#111827" font-size="24" font-weight="700">active</text>
  <text x="540" y="286" text-anchor="middle" fill="#4B5563" font-size="18">locked, lock renewed</text>

  <!-- completed -->
  <g filter="url(#shadow)">
    <rect x="900" y="210" width="260" height="100" rx="22" fill="white" stroke="#16A34A" stroke-width="2.5"/>
  </g>
  <text x="1030" y="254" text-anchor="middle" fill="#111827" font-size="24" font-weight="700">completed</text>
  <text x="1030" y="286" text-anchor="middle" fill="#4B5563" font-size="18">kept by age / count</text>

  <!-- delayed -->
  <g filter="url(#shadow)">
    <rect x="420" y="400" width="240" height="100" rx="22" fill="white" stroke="#D97706" stroke-width="2.5"/>
  </g>
  <text x="540" y="444" text-anchor="middle" fill="#111827" font-size="24" font-weight="700">delayed</text>
  <text x="540" y="476" text-anchor="middle" fill="#4B5563" font-size="18">backoff · DelayedError</text>

  <!-- failed -->
  <g filter="url(#shadow)">
    <rect x="900" y="400" width="260" height="100" rx="22" fill="white" stroke="#DC2626" stroke-width="2.5"/>
  </g>
  <text x="1030" y="444" text-anchor="middle" fill="#111827" font-size="24" font-weight="700">failed</text>
  <text x="1030" y="476" text-anchor="middle" fill="#4B5563" font-size="18">kept, retryable</text>

  <!-- dead letters -->
  <g filter="url(#shadow)">
    <rect x="900" y="540" width="260" height="96" rx="22" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  </g>
  <text x="1030" y="580" text-anchor="middle" fill="#DC2626" font-size="24" font-weight="700">dead_letters</text>
  <text x="1030" y="612" text-anchor="middle" fill="#4B5563" font-size="18">Postgres row + alert</text>

  <!-- waiting -> active -->
  <path d="M242 260H414" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="328" y="248" text-anchor="middle" fill="#4B5563" font-size="18" font-weight="600">fetch</text>

  <!-- active -> completed -->
  <path d="M662 260H894" stroke="#16A34A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <text x="778" y="248" text-anchor="middle" fill="#16A34A" font-size="18" font-weight="600">return</text>

  <!-- active -> waiting (rate limit, stall) -->
  <path d="M540 208C540 150 140 150 140 204" stroke="#2F5BFF" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <text x="340" y="148" text-anchor="middle" fill="#2F5BFF" font-size="17" font-weight="600">RateLimitError or stall → back to waiting, no attempt used</text>

  <!-- active -> delayed -->
  <path d="M540 312V394" stroke="#D97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowAmber)"/>
  <text x="526" y="348" text-anchor="end" fill="#D97706" font-size="18" font-weight="600">transient error</text>
  <text x="526" y="372" text-anchor="end" fill="#4B5563" font-size="18">backoff, attempt +1</text>

  <!-- delayed -> waiting -->
  <path d="M418 450C260 450 140 430 140 316" stroke="#D97706" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round" marker-end="url(#arrowAmber)"/>
  <text x="250" y="482" text-anchor="middle" fill="#D97706" font-size="18" font-weight="600">timer fires</text>

  <!-- active -> failed -->
  <path d="M662 295C780 295 780 450 894 450" stroke="#DC2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowRed)"/>
  <text x="800" y="350" fill="#DC2626" font-size="18" font-weight="600">UnrecoverableError</text>
  <text x="800" y="374" fill="#4B5563" font-size="18">or attempts exhausted</text>

  <!-- failed -> dead letters -->
  <path d="M1030 502V534" stroke="#DC2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowRed)"/>
  <text x="1016" y="524" text-anchor="end" fill="#DC2626" font-size="16" font-weight="600">final failure</text>

  <!-- redrive -->
  <path d="M896 600H90V318" stroke="#9CA3AF" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="494" y="588" text-anchor="middle" fill="#4B5563" font-size="17" font-weight="600">redrive after the fix: new jobId, same idempotent handler</text>
</svg>
