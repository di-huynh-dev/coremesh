<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7FB"/>
      <stop offset="1" stop-color="#EDEDF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2F5BFF"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#16A34A"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <g opacity="0.45" stroke="#D8D8E8" stroke-width="2">
    <path d="M0 112H1200M0 224H1200M0 336H1200M0 448H1200M0 560H1200"/>
    <path d="M120 0V675M264 0V675M408 0V675M552 0V675M696 0V675M840 0V675M984 0V675M1128 0V675"/>
  </g>

  <text x="40" y="68" fill="#111827" font-size="34" font-weight="800">MCP: one host, one client per server</text>

  <!-- Host -->
  <g filter="url(#shadow)">
    <rect x="40" y="105" width="360" height="510" rx="26" fill="white" stroke="#E5E7EF" stroke-width="2"/>
  </g>
  <text x="68" y="148" fill="#111827" font-size="28" font-weight="800">Host</text>
  <text x="68" y="176" fill="#4B5563" font-size="18">Claude Code, IDE, chat app</text>

  <rect x="65" y="200" width="310" height="86" rx="20" fill="#F3F0FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="220" y="236" text-anchor="middle" fill="#111827" font-size="24" font-weight="700">Model</text>
  <text x="220" y="264" text-anchor="middle" fill="#4B5563" font-size="18">sees tools, proposes calls</text>

  <path d="M220 286V312" stroke="#C4B5FD" stroke-width="3" stroke-dasharray="6 6"/>

  <rect x="65" y="320" width="310" height="64" rx="18" fill="#EEF2FF" stroke="#2F5BFF" stroke-width="2"/>
  <text x="220" y="360" text-anchor="middle" fill="#111827" font-size="22" font-weight="600">MCP client 1</text>
  <rect x="65" y="410" width="310" height="64" rx="18" fill="#EEF2FF" stroke="#2F5BFF" stroke-width="2"/>
  <text x="220" y="450" text-anchor="middle" fill="#111827" font-size="22" font-weight="600">MCP client 2</text>
  <rect x="65" y="500" width="310" height="64" rx="18" fill="#ECFDF3" stroke="#16A34A" stroke-width="2"/>
  <text x="220" y="540" text-anchor="middle" fill="#111827" font-size="22" font-weight="600">MCP client 3</text>

  <!-- Client to server connections -->
  <path d="M375 352C480 352 500 205 594 205" stroke="#2F5BFF" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M375 442C480 442 500 365 594 365" stroke="#2F5BFF" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M375 532C480 532 500 525 594 525" stroke="#16A34A" stroke-width="4" marker-end="url(#arrowGreen)"/>

  <rect x="447" y="262" width="80" height="32" rx="16" fill="white" stroke="#2F5BFF" stroke-width="2"/>
  <text x="487" y="284" text-anchor="middle" fill="#2F5BFF" font-size="18" font-weight="600">stdio</text>
  <rect x="447" y="387" width="80" height="32" rx="16" fill="white" stroke="#2F5BFF" stroke-width="2"/>
  <text x="487" y="409" text-anchor="middle" fill="#2F5BFF" font-size="18" font-weight="600">stdio</text>
  <rect x="405" y="560" width="186" height="56" rx="16" fill="white" stroke="#16A34A" stroke-width="2"/>
  <text x="498" y="583" text-anchor="middle" fill="#16A34A" font-size="18" font-weight="600">Streamable HTTP</text>
  <text x="498" y="606" text-anchor="middle" fill="#16A34A" font-size="18" font-weight="600">+ OAuth 2.1</text>

  <!-- Servers -->
  <g filter="url(#shadow)">
    <rect x="600" y="150" width="260" height="110" rx="22" fill="white" stroke="#E5E7EF" stroke-width="2"/>
    <rect x="600" y="310" width="260" height="110" rx="22" fill="white" stroke="#E5E7EF" stroke-width="2"/>
    <rect x="600" y="470" width="260" height="110" rx="22" fill="white" stroke="#E5E7EF" stroke-width="2"/>
  </g>
  <text x="730" y="198" text-anchor="middle" fill="#111827" font-size="24" font-weight="700">Server A</text>
  <text x="730" y="228" text-anchor="middle" fill="#4B5563" font-size="18">local process</text>
  <text x="730" y="358" text-anchor="middle" fill="#111827" font-size="24" font-weight="700">Server B</text>
  <text x="730" y="388" text-anchor="middle" fill="#4B5563" font-size="18">local process</text>
  <text x="730" y="518" text-anchor="middle" fill="#111827" font-size="24" font-weight="700">Server C</text>
  <text x="730" y="548" text-anchor="middle" fill="#4B5563" font-size="18">remote service</text>

  <!-- Server to backend -->
  <path d="M860 205H934" stroke="#9CA3AF" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M860 365H934" stroke="#9CA3AF" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M860 525H934" stroke="#9CA3AF" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Backends -->
  <rect x="940" y="160" width="220" height="90" rx="20" fill="#FFF7ED" stroke="#D97706" stroke-width="2"/>
  <text x="1050" y="198" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">Postgres</text>
  <text x="1050" y="226" text-anchor="middle" fill="#4B5563" font-size="18">read-only role</text>
  <rect x="940" y="320" width="220" height="90" rx="20" fill="#FFF7ED" stroke="#D97706" stroke-width="2"/>
  <text x="1050" y="358" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">Files</text>
  <text x="1050" y="386" text-anchor="middle" fill="#4B5563" font-size="18">docs folder</text>
  <rect x="940" y="480" width="220" height="90" rx="20" fill="#FFF7ED" stroke="#D97706" stroke-width="2"/>
  <text x="1050" y="518" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">Internal API</text>
  <text x="1050" y="546" text-anchor="middle" fill="#4B5563" font-size="18">scoped credential</text>

  <text x="1050" y="628" text-anchor="middle" fill="#4B5563" font-size="18">only servers touch data</text>
</svg>
