<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7FB"/>
      <stop offset="1" stop-color="#EDEDF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#16A34A"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#D97706"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2F5BFF"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <g opacity="0.45" stroke="#D8D8E8" stroke-width="2">
    <path d="M0 112H1200M0 224H1200M0 336H1200M0 448H1200M0 560H1200"/>
    <path d="M120 0V675M264 0V675M408 0V675M552 0V675M696 0V675M840 0V675M984 0V675M1128 0V675"/>
  </g>

  <text x="40" y="62" fill="#111827" font-size="34" font-weight="800">The life of a query in TanStack Query v5</text>
  <text x="40" y="98" fill="#4B5563" font-size="18">Freshness decides when to refetch. Observers decide how long the cache entry lives.</text>

  <!-- fetching -->
  <g filter="url(#shadow)">
    <rect x="360" y="128" width="380" height="100" rx="22" fill="white" stroke="#2F5BFF" stroke-width="2.5"/>
  </g>
  <text x="550" y="164" text-anchor="middle" fill="#111827" font-size="24" font-weight="700">fetching</text>
  <text x="550" y="192" text-anchor="middle" fill="#4B5563" font-size="16">queryFn({ signal }), deduped by key</text>
  <text x="550" y="215" text-anchor="middle" fill="#4B5563" font-size="16">retry 3x with backoff on failure</text>

  <!-- triggers -->
  <g filter="url(#shadow)">
    <rect x="790" y="118" width="370" height="156" rx="22" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="814" y="152" fill="#D97706" font-size="18" font-weight="800">Refetch triggers (if stale)</text>
  <text x="814" y="182" fill="#111827" font-size="16">new observer mounts</text>
  <text x="814" y="206" fill="#111827" font-size="16">window refocus, network reconnect</text>
  <text x="814" y="230" fill="#111827" font-size="16">refetchInterval tick</text>
  <text x="814" y="254" fill="#111827" font-size="16">invalidateQueries() forces it</text>
  <path d="M788 178H748" stroke="#D97706" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#arrowAmber)"/>

  <!-- states -->
  <g filter="url(#shadow)">
    <rect x="40" y="300" width="220" height="100" rx="22" fill="white" stroke="#16A34A" stroke-width="2.5"/>
    <rect x="360" y="300" width="220" height="100" rx="22" fill="white" stroke="#D97706" stroke-width="2.5"/>
    <rect x="680" y="300" width="220" height="100" rx="22" fill="white" stroke="#9CA3AF" stroke-width="2.5"/>
    <rect x="980" y="300" width="180" height="100" rx="22" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  </g>
  <text x="150" y="342" text-anchor="middle" fill="#16A34A" font-size="24" font-weight="700">fresh</text>
  <text x="150" y="372" text-anchor="middle" fill="#4B5563" font-size="16">served, no refetch</text>
  <text x="470" y="342" text-anchor="middle" fill="#D97706" font-size="24" font-weight="700">stale</text>
  <text x="470" y="372" text-anchor="middle" fill="#4B5563" font-size="16">served, then refetched</text>
  <text x="790" y="342" text-anchor="middle" fill="#4B5563" font-size="24" font-weight="700">inactive</text>
  <text x="790" y="372" text-anchor="middle" fill="#4B5563" font-size="16">0 observers, still cached</text>
  <text x="1070" y="342" text-anchor="middle" fill="#DC2626" font-size="24" font-weight="700">removed</text>
  <text x="1070" y="372" text-anchor="middle" fill="#4B5563" font-size="16">garbage collected</text>

  <!-- fresh -> stale -->
  <path d="M262 350H352" stroke="#D97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowAmber)"/>
  <text x="308" y="336" text-anchor="middle" fill="#D97706" font-size="16" font-weight="700">staleTime</text>
  <text x="308" y="374" text-anchor="middle" fill="#4B5563" font-size="16">default 0</text>

  <!-- stale -> inactive -->
  <path d="M582 350H672" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="628" y="336" text-anchor="middle" fill="#4B5563" font-size="16" font-weight="700">unmount</text>
  <text x="628" y="374" text-anchor="middle" fill="#4B5563" font-size="16">last one</text>

  <!-- inactive -> removed -->
  <path d="M902 350H972" stroke="#DC2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowRed)"/>
  <text x="938" y="336" text-anchor="middle" fill="#DC2626" font-size="16" font-weight="700">gcTime</text>
  <text x="938" y="374" text-anchor="middle" fill="#4B5563" font-size="16">5 min</text>

  <!-- stale -> fetching -->
  <path d="M470 296V236" stroke="#D97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowAmber)"/>
  <text x="458" y="268" text-anchor="end" fill="#D97706" font-size="16" font-weight="700">trigger</text>

  <!-- fetching -> fresh -->
  <path d="M358 178C220 178 150 220 150 294" stroke="#16A34A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <text x="40" y="146" fill="#16A34A" font-size="16" font-weight="700">success: new data,</text>
  <text x="40" y="170" fill="#16A34A" font-size="16" font-weight="700">dataUpdatedAt = now</text>

  <!-- inactive -> back -->
  <path d="M790 402C790 478 470 478 470 410" stroke="#2F5BFF" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <text x="630" y="500" text-anchor="middle" fill="#2F5BFF" font-size="16" font-weight="700">remount before gcTime: cached data shows instantly, refetch if stale</text>

  <!-- notes -->
  <g filter="url(#shadow)">
    <rect x="40" y="524" width="1120" height="124" rx="22" fill="white" stroke="#E5E7EF" stroke-width="2"/>
  </g>
  <text x="64" y="560" fill="#111827" font-size="17"><tspan font-weight="700">Two independent axes:</tspan> fresh/stale is about time, active/inactive is about observers. A fresh query can go inactive too.</text>
  <text x="64" y="592" fill="#111827" font-size="17"><tspan font-weight="700">invalidateQueries:</tspan> marks matches stale now; active ones refetch immediately, inactive ones on next mount.</text>
  <text x="64" y="624" fill="#111827" font-size="17"><tspan font-weight="700">setQueryData:</tspan> writes the cache directly and resets freshness. This is what optimistic updates are built on.</text>
</svg>
