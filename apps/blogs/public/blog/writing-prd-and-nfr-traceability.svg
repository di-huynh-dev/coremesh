<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7FB"/>
      <stop offset="1" stop-color="#EDEDF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2F5BFF"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7C3AED"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0D9488"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <g opacity="0.45" stroke="#D8D8E8" stroke-width="2">
    <path d="M0 112H1200M0 224H1200M0 336H1200M0 448H1200M0 560H1200"/>
    <path d="M120 0V675M264 0V675M408 0V675M552 0V675M696 0V675M840 0V675M984 0V675M1128 0V675"/>
  </g>

  <text x="40" y="58" fill="#111827" font-size="32" font-weight="800">PRD anatomy and the traceability chain</text>
  <text x="40" y="92" fill="#4B5563" font-size="18">Every requirement traces up to a goal and down to a test. The metric closes the loop.</text>

  <!-- PRD document card -->
  <g filter="url(#shadow)">
    <rect x="40" y="120" width="360" height="530" rx="22" fill="white" stroke="#E5E7EF" stroke-width="2"/>
  </g>
  <text x="64" y="156" fill="#111827" font-size="19" font-weight="800">PRD · Appointment reminders</text>

  <rect x="56" y="176" width="328" height="38" rx="10" fill="#F9FAFB"/>
  <text x="72" y="201" fill="#4B5563" font-size="17">1  Problem &amp; context</text>

  <rect x="56" y="222" width="328" height="38" rx="10" fill="#EEF2FF"/>
  <rect x="56" y="222" width="6" height="38" rx="3" fill="#2F5BFF"/>
  <text x="72" y="247" fill="#111827" font-size="17" font-weight="700">2  Goals / non-goals</text>

  <rect x="56" y="268" width="328" height="38" rx="10" fill="#F9FAFB"/>
  <text x="72" y="293" fill="#4B5563" font-size="17">3  Users &amp; personas</text>

  <rect x="56" y="314" width="328" height="38" rx="10" fill="#F0FDFA"/>
  <rect x="56" y="314" width="6" height="38" rx="3" fill="#0D9488"/>
  <text x="72" y="339" fill="#111827" font-size="17" font-weight="700">4  Success metrics</text>

  <rect x="56" y="360" width="328" height="38" rx="10" fill="#F9FAFB"/>
  <text x="72" y="385" fill="#4B5563" font-size="17">5  Scope (in / out)</text>

  <rect x="56" y="406" width="328" height="38" rx="10" fill="#F9FAFB"/>
  <text x="72" y="431" fill="#4B5563" font-size="17">6  User flows</text>

  <rect x="56" y="452" width="328" height="38" rx="10" fill="#F5F3FF"/>
  <rect x="56" y="452" width="6" height="38" rx="3" fill="#7C3AED"/>
  <text x="72" y="477" fill="#111827" font-size="17" font-weight="700">7  Functional requirements</text>

  <rect x="56" y="498" width="328" height="38" rx="10" fill="#F5F3FF"/>
  <rect x="56" y="498" width="6" height="38" rx="3" fill="#7C3AED"/>
  <text x="72" y="523" fill="#111827" font-size="17" font-weight="700">8  Non-functional (ISO 25010)</text>

  <rect x="56" y="544" width="328" height="38" rx="10" fill="#F9FAFB"/>
  <text x="72" y="569" fill="#4B5563" font-size="17">9  Open questions</text>

  <rect x="56" y="590" width="328" height="38" rx="10" fill="#F9FAFB"/>
  <text x="72" y="615" fill="#4B5563" font-size="17">10  Rollout &amp; risks</text>

  <!-- Chain cards -->
  <g filter="url(#shadow)">
    <rect x="500" y="120" width="560" height="78" rx="20" fill="white" stroke="#2F5BFF" stroke-width="2.5"/>
    <rect x="500" y="228" width="560" height="78" rx="20" fill="white" stroke="#7C3AED" stroke-width="2.5"/>
    <rect x="500" y="336" width="560" height="78" rx="20" fill="white" stroke="#D97706" stroke-width="2.5"/>
    <rect x="500" y="444" width="560" height="78" rx="20" fill="white" stroke="#16A34A" stroke-width="2.5"/>
    <rect x="500" y="552" width="560" height="78" rx="20" fill="white" stroke="#0D9488" stroke-width="2.5"/>
  </g>

  <text x="524" y="150" fill="#2F5BFF" font-size="16" font-weight="800">GOAL · G1</text>
  <text x="524" y="180" fill="#111827" font-size="18" font-weight="600">Reduce no-shows for online bookings</text>
  <rect x="954" y="134" width="90" height="30" rx="15" fill="#EEF2FF"/>
  <text x="999" y="155" text-anchor="middle" fill="#2F5BFF" font-size="16" font-weight="700">PM</text>

  <text x="524" y="258" fill="#7C3AED" font-size="16" font-weight="800">REQUIREMENT · FR-01 / NFR-04</text>
  <text x="524" y="288" fill="#111827" font-size="18" font-weight="600">Remind at 24h and 2h; no health data in SMS</text>
  <rect x="954" y="242" width="90" height="30" rx="15" fill="#F5F3FF"/>
  <text x="999" y="263" text-anchor="middle" fill="#7C3AED" font-size="16" font-weight="700">BA · Eng</text>

  <text x="524" y="366" fill="#D97706" font-size="16" font-weight="800">USER STORY · BK-142</text>
  <text x="524" y="396" fill="#111827" font-size="18" font-weight="600">Confirm or cancel from the reminder link</text>
  <rect x="954" y="350" width="90" height="30" rx="15" fill="#FFFBEB"/>
  <text x="999" y="371" text-anchor="middle" fill="#D97706" font-size="16" font-weight="700">Team</text>

  <text x="524" y="474" fill="#16A34A" font-size="16" font-weight="800">TEST CASE · TC-142-3</text>
  <text x="524" y="504" fill="#111827" font-size="18" font-weight="600">Reminder is sent exactly once per window</text>
  <rect x="954" y="458" width="90" height="30" rx="15" fill="#F0FDF4"/>
  <text x="999" y="479" text-anchor="middle" fill="#16A34A" font-size="16" font-weight="700">QA</text>

  <text x="524" y="582" fill="#0D9488" font-size="16" font-weight="800">METRIC · M1</text>
  <text x="524" y="612" fill="#111827" font-size="18" font-weight="600">Weekly no-show rate, online bookings</text>
  <rect x="954" y="566" width="90" height="30" rx="15" fill="#F0FDFA"/>
  <text x="999" y="587" text-anchor="middle" fill="#0D9488" font-size="16" font-weight="700">Data</text>

  <!-- chain arrows -->
  <path d="M620 200V222" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="636" y="218" fill="#4B5563" font-size="16" font-weight="600">refined into</text>
  <path d="M620 308V330" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="636" y="326" fill="#4B5563" font-size="16" font-weight="600">delivered by</text>
  <path d="M620 416V438" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="636" y="434" fill="#4B5563" font-size="16" font-weight="600">verified by</text>
  <path d="M620 524V546" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="636" y="542" fill="#4B5563" font-size="16" font-weight="600">proven in production by</text>

  <!-- PRD sections to chain -->
  <path d="M386 241C444 241 440 159 494 159" stroke="#2F5BFF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M386 471C448 471 436 270 494 270" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowPurple)"/>
  <path d="M386 517C458 517 444 284 494 284" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowPurple)"/>
  <path d="M386 333C452 333 432 591 494 591" stroke="#0D9488" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowTeal)"/>

  <!-- feedback loop -->
  <path d="M1062 591C1150 591 1150 159 1068 159" stroke="#0D9488" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
  <text x="1150" y="375" text-anchor="middle" fill="#0D9488" font-size="16" font-weight="700" transform="rotate(-90 1150 375)">did the goal move? revisit after launch</text>
</svg>
