<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7FB"/>
      <stop offset="1" stop-color="#EDEDF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <g opacity="0.45" stroke="#D8D8E8" stroke-width="2">
    <path d="M0 112H1200"/><path d="M0 336H1200"/><path d="M0 560H1200"/>
    <path d="M264 0V675"/><path d="M696 0V675"/><path d="M1128 0V675"/>
  </g>
  <text x="44" y="68" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">View Transition lifecycle</text>

  <g font-family="Inter, Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect x="44" y="96" width="250" height="160" rx="22" fill="white" stroke="#E5E7EF"/>
      <rect x="340" y="96" width="250" height="160" rx="22" fill="white" stroke="#E5E7EF"/>
      <rect x="636" y="96" width="250" height="160" rx="22" fill="white" stroke="#E5E7EF"/>
      <rect x="932" y="96" width="224" height="160" rx="22" fill="white" stroke="#E5E7EF"/>
    </g>

    <circle cx="80" cy="134" r="18" fill="#2F5BFF"/>
    <text x="80" y="141" text-anchor="middle" fill="white" font-size="20" font-weight="700">1</text>
    <text x="108" y="142" fill="#111827" font-size="22" font-weight="700">Capture old</text>
    <text x="68" y="192" fill="#4B5563" font-size="18" font-weight="500">Snapshot each</text>
    <text x="68" y="220" fill="#4B5563" font-size="18" font-weight="500">named element</text>

    <circle cx="376" cy="134" r="18" fill="#7C3AED"/>
    <text x="376" y="141" text-anchor="middle" fill="white" font-size="20" font-weight="700">2</text>
    <text x="404" y="142" fill="#111827" font-size="22" font-weight="700">Update DOM</text>
    <text x="364" y="192" fill="#4B5563" font-size="18" font-weight="500">Your callback runs,</text>
    <text x="364" y="220" fill="#4B5563" font-size="18" font-weight="500">rendering paused</text>

    <circle cx="672" cy="134" r="18" fill="#16A34A"/>
    <text x="672" y="141" text-anchor="middle" fill="white" font-size="20" font-weight="700">3</text>
    <text x="700" y="142" fill="#111827" font-size="22" font-weight="700">Capture new</text>
    <text x="660" y="192" fill="#4B5563" font-size="18" font-weight="500">Live view of</text>
    <text x="660" y="220" fill="#4B5563" font-size="18" font-weight="500">the new DOM</text>

    <circle cx="968" cy="134" r="18" fill="#D97706"/>
    <text x="968" y="141" text-anchor="middle" fill="white" font-size="20" font-weight="700">4</text>
    <text x="996" y="142" fill="#111827" font-size="22" font-weight="700">Animate</text>
    <text x="956" y="192" fill="#4B5563" font-size="18" font-weight="500">CSS animations</text>
    <text x="956" y="220" fill="#4B5563" font-size="18" font-weight="500">on pseudo-elements</text>

    <path d="M298 176H334" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M594 176H630" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M890 176H926" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

    <path d="M64 300H1140" stroke="#C7C7D8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="64" cy="300" r="9" fill="#2F5BFF"/>
    <circle cx="590" cy="300" r="9" fill="#7C3AED"/>
    <circle cx="909" cy="300" r="9" fill="#16A34A"/>
    <circle cx="1140" cy="300" r="9" fill="#D97706"/>
    <text x="52" y="338" fill="#111827" font-size="18" font-weight="600">startViewTransition()</text>
    <text x="590" y="338" text-anchor="middle" fill="#111827" font-size="18" font-weight="600">updateCallbackDone</text>
    <text x="909" y="338" text-anchor="middle" fill="#111827" font-size="18" font-weight="600">ready</text>
    <text x="1148" y="338" text-anchor="end" fill="#111827" font-size="18" font-weight="600">finished</text>

    <g filter="url(#shadow)">
      <rect x="44" y="372" width="1112" height="280" rx="24" fill="white" stroke="#E5E7EF"/>
    </g>
    <text x="74" y="414" fill="#111827" font-size="22" font-weight="700">Pseudo-element tree (one branch per view-transition-name)</text>

    <g stroke="#C7C7D8" stroke-width="3" stroke-linecap="round">
      <path d="M86 470V496H104"/>
      <path d="M122 510V536H140"/>
      <path d="M158 550V576H176"/>
      <path d="M158 576V616H176"/>
    </g>
    <g font-size="20" font-weight="600" fill="#111827">
      <text x="74" y="462">::view-transition</text>
      <text x="110" y="502">::view-transition-group(cover)</text>
      <text x="146" y="542">::view-transition-image-pair(cover)</text>
      <text x="182" y="582">::view-transition-old(cover)</text>
      <text x="182" y="622">::view-transition-new(cover)</text>
    </g>
    <g font-size="18" font-weight="500" fill="#4B5563">
      <text x="700" y="462">Overlay above the whole page</text>
      <text x="700" y="502">Animates position and size</text>
      <text x="700" y="542">Holds the old and new views</text>
      <text x="700" y="582">Static image of the old state</text>
      <text x="700" y="622">Live rendering of the new state</text>
    </g>
    <circle cx="684" cy="576" r="6" fill="#DC2626"/>
    <circle cx="684" cy="616" r="6" fill="#16A34A"/>
  </g>
</svg>
