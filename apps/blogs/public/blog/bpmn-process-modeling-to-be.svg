<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7FB"/>
      <stop offset="1" stop-color="#EDEDF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="seq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#374151"/>
    </marker>
    <marker id="msg" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1L11 6L1 11z" fill="white" stroke="#2F5BFF" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <g opacity="0.45" stroke="#D8D8E8" stroke-width="2">
    <path d="M0 112H1200M0 224H1200M0 336H1200M0 448H1200M0 560H1200"/>
    <path d="M120 0V675M264 0V675M408 0V675M552 0V675M696 0V675M840 0V675M984 0V675M1128 0V675"/>
  </g>

  <text x="40" y="58" fill="#111827" font-size="34" font-weight="800">Purchase request: the to-be process</text>
  <text x="40" y="92" fill="#4B5563" font-size="18">Budget is checked first, a timer chases slow approvals, PO and budget reservation run in parallel.</text>

  <g filter="url(#shadow)"><rect x="30" y="112" width="1140" height="488" rx="10" fill="white"/></g>
  <rect x="30" y="112" width="1140" height="488" rx="10" stroke="#374151" stroke-width="2"/>
  <path d="M64 112V600M100 112V600" stroke="#374151" stroke-width="2"/>
  <path d="M64 222H1170M64 392H1170M64 496H1170" stroke="#9CA3AF" stroke-width="2"/>
  <text transform="translate(53 356) rotate(-90)" text-anchor="middle" fill="#111827" font-size="17" font-weight="800">Purchase request (to-be)</text>

  <text transform="translate(88 167) rotate(-90)" text-anchor="middle" fill="#374151" font-size="16" font-weight="700">Requester</text>
  <text transform="translate(88 307) rotate(-90)" text-anchor="middle" fill="#374151" font-size="16" font-weight="700">Approvers</text>
  <text transform="translate(88 444) rotate(-90)" text-anchor="middle" fill="#374151" font-size="16" font-weight="700">Finance</text>
  <text transform="translate(88 548) rotate(-90)" text-anchor="middle" fill="#374151" font-size="16" font-weight="700">Procurement</text>

  <!-- start, submit, budget check -->
  <circle cx="150" cy="167" r="16" fill="white" stroke="#16A34A" stroke-width="2.5"/>
  <text x="150" y="213" text-anchor="middle" fill="#4B5563" font-size="16" font-weight="600">Need goods</text>
  <path d="M166 167H184" stroke="#374151" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#seq)"/>
  <rect x="190" y="137" width="116" height="60" rx="10" fill="white" stroke="#2F5BFF" stroke-width="2.5"/>
  <text x="248" y="162" text-anchor="middle" fill="#111827" font-size="16" font-weight="600">Submit</text>
  <text x="248" y="183" text-anchor="middle" fill="#111827" font-size="16" font-weight="600">request</text>
  <path d="M306 167H370V408" stroke="#374151" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#seq)"/>
  <rect x="312" y="414" width="116" height="60" rx="10" fill="white" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="370" y="439" text-anchor="middle" fill="#111827" font-size="16" font-weight="600">Check</text>
  <text x="370" y="460" text-anchor="middle" fill="#111827" font-size="16" font-weight="600">budget</text>
  <circle cx="324" cy="426" r="5" stroke="#7C3AED" stroke-width="3" stroke-dasharray="2.5 1.6"/>
  <path d="M428 444H470" stroke="#374151" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#seq)"/>
  <path d="M500 420L524 444L500 468L476 444z" fill="white" stroke="#D97706" stroke-width="2.5"/>
  <path d="M492 436L508 452M508 436L492 452" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/>
  <text x="500" y="490" text-anchor="middle" fill="#111827" font-size="16" font-weight="600">Budget OK?</text>
  <path d="M500 420V167H588" stroke="#374151" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#seq)"/>
  <text x="508" y="412" text-anchor="start" fill="#DC2626" font-size="16" font-weight="600">No</text>
  <path d="M524 444H560V306" stroke="#374151" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#seq)"/>
  <text x="530" y="436" text-anchor="start" fill="#16A34A" font-size="16" font-weight="600">Yes</text>

  <!-- approve with a non-interrupting timer -->
  <rect x="545" y="240" width="116" height="60" rx="10" fill="white" stroke="#2F5BFF" stroke-width="2.5"/>
  <text x="603" y="265" text-anchor="middle" fill="#111827" font-size="16" font-weight="600">Approve</text>
  <text x="603" y="286" text-anchor="middle" fill="#111827" font-size="16" font-weight="600">request</text>
  <circle cx="640" cy="300" r="14" fill="white" stroke="#D97706" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="640" cy="300" r="10" fill="white" stroke="#D97706" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="640" cy="300" r="6" fill="white" stroke="#374151" stroke-width="1.5"/>
  <path d="M640 296V300H643" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  <text x="612" y="336" text-anchor="end" fill="#D97706" font-size="16" font-weight="700">48h</text>
  <path d="M640 314V352H662" stroke="#374151" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#seq)"/>
  <rect x="668" y="327" width="104" height="50" rx="10" fill="white" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="720" y="347" text-anchor="middle" fill="#111827" font-size="16" font-weight="600">Send</text>
  <text x="720" y="368" text-anchor="middle" fill="#111827" font-size="16" font-weight="600">reminder</text>
  <circle cx="680" cy="339" r="5" stroke="#7C3AED" stroke-width="3" stroke-dasharray="2.5 1.6"/>
  <path d="M772 352H784" stroke="#374151" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#seq)"/>
  <circle cx="800" cy="352" r="14" fill="white" stroke="#374151" stroke-width="4"/>
  <path d="M661 270H690" stroke="#374151" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#seq)"/>
  <path d="M720 246L744 270L720 294L696 270z" fill="white" stroke="#D97706" stroke-width="2.5"/>
  <path d="M712 262L728 278M728 262L712 278" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/>
  <text x="744" y="240" text-anchor="start" fill="#111827" font-size="16" font-weight="600">Approved?</text>
  <path d="M720 246V167H632" stroke="#374151" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#seq)"/>
  <text x="728" y="205" text-anchor="start" fill="#DC2626" font-size="16" font-weight="600">No</text>
  <circle cx="610" cy="167" r="16" fill="white" stroke="#DC2626" stroke-width="4"/>
  <text x="610" y="210" text-anchor="middle" fill="#DC2626" font-size="16" font-weight="700">Rejected</text>
  <path d="M744 270H850V414" stroke="#374151" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#seq)"/>
  <text x="758" y="262" text-anchor="start" fill="#16A34A" font-size="16" font-weight="600">Yes</text>

  <!-- parallel split and join -->
  <path d="M850 420L874 444L850 468L826 444z" fill="white" stroke="#D97706" stroke-width="2.5"/>
  <path d="M850 433V455M839 444H861" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M874 444H900" stroke="#374151" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#seq)"/>
  <rect x="906" y="414" width="116" height="60" rx="10" fill="white" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="964" y="439" text-anchor="middle" fill="#111827" font-size="16" font-weight="600">Reserve</text>
  <text x="964" y="460" text-anchor="middle" fill="#111827" font-size="16" font-weight="600">budget</text>
  <circle cx="918" cy="426" r="5" stroke="#7C3AED" stroke-width="3" stroke-dasharray="2.5 1.6"/>
  <path d="M850 468V548H900" stroke="#374151" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#seq)"/>
  <rect x="906" y="518" width="116" height="60" rx="10" fill="white" stroke="#2F5BFF" stroke-width="2.5"/>
  <text x="964" y="554" text-anchor="middle" fill="#111827" font-size="16" font-weight="600">Create PO</text>
  <path d="M1022 444H1070V518" stroke="#374151" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#seq)"/>
  <path d="M1022 548H1040" stroke="#374151" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#seq)"/>
  <path d="M1070 524L1094 548L1070 572L1046 548z" fill="white" stroke="#D97706" stroke-width="2.5"/>
  <path d="M1070 537V559M1059 548H1081" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M1094 548H1108" stroke="#374151" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#seq)"/>
  <circle cx="1130" cy="548" r="16" fill="white" stroke="#2F5BFF" stroke-width="4"/>
  <path d="M1121 542H1139V555H1121z" fill="#2F5BFF"/>
  <path d="M1121 542L1130 549L1139 542" stroke="white" stroke-width="1.5"/>
  <text x="1130" y="520" text-anchor="middle" fill="#2F5BFF" font-size="16" font-weight="700">PO sent</text>

  <!-- legend -->
  <rect x="836" y="124" width="320" height="88" rx="12" fill="#F9FAFB" stroke="#E5E7EF" stroke-width="2"/>
  <rect x="852" y="138" width="28" height="20" rx="5" fill="white" stroke="#2F5BFF" stroke-width="2.5"/>
  <text x="890" y="154" text-anchor="start" fill="#374151" font-size="16" font-weight="600">user task</text>
  <rect x="998" y="138" width="28" height="20" rx="5" fill="white" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="1036" y="154" text-anchor="start" fill="#374151" font-size="16" font-weight="600">automated</text>
  <path d="M866 174L880 188L866 202L852 188z" fill="white" stroke="#D97706" stroke-width="2"/>
  <path d="M862 184L870 192M870 184L862 192" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
  <text x="890" y="194" text-anchor="start" fill="#374151" font-size="16" font-weight="600">exclusive</text>
  <path d="M1012 174L1026 188L1012 202L998 188z" fill="white" stroke="#D97706" stroke-width="2"/>
  <path d="M1012 182V194M1006 188H1018" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
  <text x="1036" y="194" text-anchor="start" fill="#374151" font-size="16" font-weight="600">parallel</text>

  <!-- supplier pool and message flow -->
  <rect x="30" y="618" width="1140" height="42" rx="8" fill="white" stroke="#374151" stroke-width="2"/>
  <text x="600" y="645" text-anchor="middle" fill="#111827" font-size="16" font-weight="700">Supplier (collapsed pool, black box)</text>
  <text x="1112" y="645" text-anchor="end" fill="#2F5BFF" font-size="16" font-weight="600">purchase order</text>
  <circle cx="1130" cy="569" r="4" fill="white" stroke="#2F5BFF" stroke-width="1.5"/>
  <path d="M1130 573V612" stroke="#2F5BFF" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#msg)"/>
</svg>
