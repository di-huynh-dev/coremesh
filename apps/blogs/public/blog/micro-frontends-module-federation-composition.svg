<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7FB"/>
      <stop offset="1" stop-color="#EDEDF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#16A34A"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#D97706"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2F5BFF"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#DC2626"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7C3AED"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <g opacity="0.45" stroke="#D8D8E8" stroke-width="2">
    <path d="M0 112H1200M0 224H1200M0 336H1200M0 448H1200M0 560H1200"/>
    <path d="M120 0V675M264 0V675M408 0V675M552 0V675M696 0V675M840 0V675M984 0V675M1128 0V675"/>
  </g>

  <text x="40" y="62" fill="#111827" font-size="34" font-weight="800">Shell + remotes, composed at runtime</text>
  <text x="40" y="98" fill="#4B5563" font-size="18">A registry pins versions, shared singletons load once, and a dead remote degrades to a fallback.</text>

  <!-- registry -->
  <g filter="url(#shadow)">
    <rect x="40" y="130" width="280" height="122" rx="22" fill="white" stroke="#2F5BFF" stroke-width="2.5"/>
  </g>
  <text x="180" y="170" text-anchor="middle" fill="#111827" font-size="24" font-weight="700">Remote registry</text>
  <text x="180" y="202" text-anchor="middle" fill="#4B5563" font-size="18">checkout → 1.42.0</text>
  <text x="180" y="230" text-anchor="middle" fill="#4B5563" font-size="18">/mf-manifest.json</text>

  <!-- shell -->
  <g filter="url(#shadow)">
    <rect x="380" y="130" width="440" height="122" rx="22" fill="white" stroke="#111827" stroke-width="2.5"/>
  </g>
  <text x="600" y="170" text-anchor="middle" fill="#111827" font-size="26" font-weight="800">Shell (host)</text>
  <text x="600" y="202" text-anchor="middle" fill="#4B5563" font-size="18">top-level routing · session · layout</text>
  <text x="600" y="230" text-anchor="middle" fill="#4B5563" font-size="18">one error boundary per remote</text>

  <!-- telemetry -->
  <g filter="url(#shadow)">
    <rect x="880" y="130" width="280" height="122" rx="22" fill="white" stroke="#E5E7EF" stroke-width="2"/>
  </g>
  <text x="1020" y="170" text-anchor="middle" fill="#111827" font-size="24" font-weight="700">Telemetry</text>
  <text x="1020" y="202" text-anchor="middle" fill="#4B5563" font-size="18">remote_load_failed</text>
  <text x="1020" y="230" text-anchor="middle" fill="#4B5563" font-size="18">error rate per remote</text>

  <!-- registry -> shell -->
  <path d="M322 191H372" stroke="#2F5BFF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <text x="350" y="178" text-anchor="middle" fill="#2F5BFF" font-size="16" font-weight="600">1</text>

  <!-- shell -> telemetry -->
  <path d="M822 191H872" stroke="#9CA3AF" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- remotes -->
  <g filter="url(#shadow)">
    <rect x="40" y="410" width="260" height="120" rx="22" fill="white" stroke="#16A34A" stroke-width="2.5"/>
  </g>
  <text x="170" y="452" text-anchor="middle" fill="#111827" font-size="24" font-weight="700">catalog</text>
  <text x="170" y="482" text-anchor="middle" fill="#4B5563" font-size="18">team A · own deploy</text>
  <text x="170" y="508" text-anchor="middle" fill="#16A34A" font-size="17" font-weight="600">loaded</text>

  <g filter="url(#shadow)">
    <rect x="330" y="410" width="260" height="120" rx="22" fill="white" stroke="#16A34A" stroke-width="2.5"/>
  </g>
  <text x="460" y="452" text-anchor="middle" fill="#111827" font-size="24" font-weight="700">account</text>
  <text x="460" y="482" text-anchor="middle" fill="#4B5563" font-size="18">team B · own deploy</text>
  <text x="460" y="508" text-anchor="middle" fill="#16A34A" font-size="17" font-weight="600">loaded</text>

  <g filter="url(#shadow)">
    <rect x="620" y="410" width="260" height="120" rx="22" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="10 7"/>
  </g>
  <text x="750" y="452" text-anchor="middle" fill="#DC2626" font-size="24" font-weight="700">checkout</text>
  <text x="750" y="482" text-anchor="middle" fill="#4B5563" font-size="18">team C · CDN 503</text>
  <text x="750" y="508" text-anchor="middle" fill="#DC2626" font-size="17" font-weight="600">entry failed to load</text>

  <g filter="url(#shadow)">
    <rect x="920" y="410" width="240" height="120" rx="22" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
  </g>
  <text x="1040" y="452" text-anchor="middle" fill="#111827" font-size="24" font-weight="700">Fallback UI</text>
  <text x="1040" y="482" text-anchor="middle" fill="#4B5563" font-size="18">via errorLoadRemote</text>
  <text x="1040" y="508" text-anchor="middle" fill="#D97706" font-size="17" font-weight="600">rest of page still works</text>

  <!-- shell -> remotes -->
  <path d="M470 254C470 330 170 320 170 402" stroke="#16A34A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <path d="M560 254C560 330 460 330 460 402" stroke="#16A34A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <text x="200" y="300" text-anchor="middle" fill="#16A34A" font-size="18" font-weight="600">2. loadRemote()</text>
  <path d="M680 254C680 330 750 330 750 402" stroke="#DC2626" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round" marker-end="url(#arrowRed)"/>
  <text x="772" y="324" fill="#DC2626" font-size="18" font-weight="600">✕ timeout / 503</text>

  <!-- checkout -> fallback -->
  <path d="M882 470H912" stroke="#D97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowAmber)"/>

  <!-- remotes -> shared -->
  <path d="M170 532V580M460 532V580M750 532V580" stroke="#7C3AED" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>
  <text x="315" y="563" text-anchor="middle" fill="#7C3AED" font-size="16" font-weight="600">reuse, don't bundle</text>

  <!-- shared scope -->
  <rect x="40" y="584" width="1120" height="74" rx="20" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="600" y="615" text-anchor="middle" fill="#7C3AED" font-size="21" font-weight="700">Shared scope: react 19 · react-dom 19 · @acme/design-system 4</text>
  <text x="600" y="643" text-anchor="middle" fill="#4B5563" font-size="17">singleton: true · one instance per page · negotiated against requiredVersion at load time</text>
</svg>
