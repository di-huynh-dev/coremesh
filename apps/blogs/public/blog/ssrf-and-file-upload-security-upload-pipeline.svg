<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7FB"/>
      <stop offset="1" stop-color="#EDEDF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#16A34A"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#D97706"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2F5BFF"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <g opacity="0.45" stroke="#D8D8E8" stroke-width="2">
    <path d="M0 112H1200M0 224H1200M0 336H1200M0 448H1200M0 560H1200"/>
    <path d="M120 0V675M264 0V675M408 0V675M552 0V675M696 0V675M840 0V675M984 0V675M1128 0V675"/>
  </g>

  <text x="40" y="62" fill="#111827" font-size="34" font-weight="800">A safe upload pipeline</text>
  <text x="40" y="98" fill="#4B5563" font-size="18">Presign → quarantine → sniff, scan, re-encode → public bucket on a separate domain.</text>

  <!-- browser -->
  <g filter="url(#shadow)">
    <rect x="40" y="150" width="200" height="100" rx="22" fill="white" stroke="#E5E7EF" stroke-width="2"/>
  </g>
  <text x="140" y="194" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">Browser</text>
  <text x="140" y="224" text-anchor="middle" fill="#4B5563" font-size="16">picks a file</text>

  <!-- api -->
  <g filter="url(#shadow)">
    <rect x="330" y="150" width="240" height="100" rx="22" fill="white" stroke="#2F5BFF" stroke-width="2.5"/>
  </g>
  <text x="450" y="194" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">API /uploads</text>
  <text x="450" y="224" text-anchor="middle" fill="#4B5563" font-size="16">pending row + presigned POST</text>

  <!-- quarantine -->
  <g filter="url(#shadow)">
    <rect x="660" y="150" width="250" height="100" rx="22" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
  </g>
  <text x="785" y="194" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">quarantine bucket</text>
  <text x="785" y="224" text-anchor="middle" fill="#4B5563" font-size="16">private · 1-day lifecycle</text>

  <!-- queue -->
  <g filter="url(#shadow)">
    <rect x="990" y="150" width="170" height="100" rx="22" fill="white" stroke="#E5E7EF" stroke-width="2"/>
  </g>
  <text x="1075" y="194" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">queue</text>
  <text x="1075" y="224" text-anchor="middle" fill="#4B5563" font-size="16">ObjectCreated</text>

  <!-- worker -->
  <g filter="url(#shadow)">
    <rect x="560" y="330" width="600" height="140" rx="22" fill="white" stroke="#2F5BFF" stroke-width="2.5"/>
  </g>
  <text x="586" y="368" fill="#111827" font-size="22" font-weight="700">Worker</text>
  <text x="680" y="368" fill="#4B5563" font-size="16">reads quarantine, writes public, nothing else</text>
  <rect x="584" y="392" width="130" height="52" rx="14" fill="#EEF2FF" stroke="#2F5BFF" stroke-width="1.5"/>
  <text x="649" y="424" text-anchor="middle" fill="#1E3A8A" font-size="16" font-weight="600">magic bytes</text>
  <rect x="726" y="392" width="130" height="52" rx="14" fill="#EEF2FF" stroke="#2F5BFF" stroke-width="1.5"/>
  <text x="791" y="424" text-anchor="middle" fill="#1E3A8A" font-size="16" font-weight="600">malware scan</text>
  <rect x="868" y="392" width="130" height="52" rx="14" fill="#EEF2FF" stroke="#2F5BFF" stroke-width="1.5"/>
  <text x="933" y="424" text-anchor="middle" fill="#1E3A8A" font-size="16" font-weight="600">sharp re-encode</text>
  <rect x="1010" y="392" width="130" height="52" rx="14" fill="#EEF2FF" stroke="#2F5BFF" stroke-width="1.5"/>
  <text x="1075" y="424" text-anchor="middle" fill="#1E3A8A" font-size="16" font-weight="600">strip metadata</text>

  <!-- rejected -->
  <g filter="url(#shadow)">
    <rect x="40" y="370" width="260" height="100" rx="22" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  </g>
  <text x="170" y="414" text-anchor="middle" fill="#DC2626" font-size="22" font-weight="700">rejected</text>
  <text x="170" y="444" text-anchor="middle" fill="#4B5563" font-size="16">delete object, mark row</text>

  <!-- note -->
  <rect x="40" y="530" width="480" height="110" rx="22" fill="white" fill-opacity="0.6" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="66" y="572" fill="#111827" font-size="18" font-weight="700">Never served to anyone:</text>
  <text x="66" y="602" fill="#4B5563" font-size="17">the original bytes, the client's filename,</text>
  <text x="66" y="626" fill="#4B5563" font-size="17">the client's MIME type.</text>

  <!-- public bucket -->
  <g filter="url(#shadow)">
    <rect x="560" y="530" width="240" height="110" rx="22" fill="white" stroke="#16A34A" stroke-width="2.5"/>
  </g>
  <text x="680" y="574" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">public bucket</text>
  <text x="680" y="604" text-anchor="middle" fill="#4B5563" font-size="16">u/&lt;uuid&gt; · own type</text>

  <!-- cdn -->
  <g filter="url(#shadow)">
    <rect x="860" y="530" width="300" height="110" rx="22" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.5"/>
  </g>
  <text x="1010" y="566" text-anchor="middle" fill="#16A34A" font-size="20" font-weight="700">usercontent domain</text>
  <text x="1010" y="594" text-anchor="middle" fill="#4B5563" font-size="16">nosniff · Content-Disposition</text>
  <text x="1010" y="620" text-anchor="middle" fill="#4B5563" font-size="16">sandbox CSP · no app cookies</text>

  <!-- 1: browser -> api -->
  <path d="M242 200H324" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="285" y="186" text-anchor="middle" fill="#4B5563" font-size="16" font-weight="600">1 ask</text>

  <!-- 2: browser -> quarantine -->
  <path d="M140 252V292H785V256" stroke="#D97706" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowAmber)"/>
  <text x="460" y="284" text-anchor="middle" fill="#D97706" font-size="16" font-weight="600">2 direct POST · size, type and key are signed</text>

  <!-- 3: quarantine -> queue -->
  <path d="M912 200H984" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="948" y="186" text-anchor="middle" fill="#4B5563" font-size="16" font-weight="600">3</text>

  <!-- 4: queue -> worker -->
  <path d="M1075 252V324" stroke="#2F5BFF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <text x="1090" y="296" fill="#2F5BFF" font-size="16" font-weight="600">4 consume</text>

  <!-- worker -> rejected -->
  <path d="M558 420H306" stroke="#DC2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowRed)"/>
  <text x="430" y="408" text-anchor="middle" fill="#DC2626" font-size="16" font-weight="600">any check fails</text>

  <!-- 5: worker -> public -->
  <path d="M680 472V524" stroke="#16A34A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <text x="694" y="504" fill="#16A34A" font-size="16" font-weight="600">5 clean, re-encoded</text>

  <!-- public -> cdn -->
  <path d="M802 585H854" stroke="#16A34A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
</svg>
