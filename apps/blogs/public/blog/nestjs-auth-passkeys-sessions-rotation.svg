<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="title description"><title id="title">Refresh token rotation and reuse detection</title><desc id="description">The client exchanges RT1 for RT2. An attacker replays RT1, causing the server to revoke the whole token family. The legitimate client is then unable to refresh with RT2.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F7F7FB"/><stop offset="1" stop-color="#EDEDF7"/></linearGradient><marker id="2F5BFF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F5BFF"/></marker><marker id="16A34A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16A34A"/></marker><marker id="DC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker><marker id="D97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><g opacity="0.4" stroke="#D8D8E8"><path d="M0 168H1200M0 336H1200M0 504H1200M200 0V675M400 0V675M600 0V675M800 0V675M1000 0V675"/></g><text x="40" y="61" fill="#111827" font-size="31" font-weight="800" text-anchor="start">Refresh token rotation and reuse detection</text><text x="40" y="95" fill="#4B5563" font-size="18" font-weight="400" text-anchor="start">A refresh token is single-use. Retain its used record to detect replay.</text><rect x="50" y="130" width="200" height="64" rx="20" fill="white" stroke="#2F5BFF" stroke-width="2"/><text x="72" y="167" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Client</text><path d="M150 194V574" stroke="#C4C9D8" stroke-width="2" stroke-dasharray="7 7"/><rect x="500" y="130" width="200" height="64" rx="20" fill="white" stroke="#16A34A" stroke-width="2"/><text x="522" y="167" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Auth server</text><path d="M600 194V574" stroke="#C4C9D8" stroke-width="2" stroke-dasharray="7 7"/><rect x="950" y="130" width="200" height="64" rx="20" fill="white" stroke="#DC2626" stroke-width="2"/><text x="972" y="167" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Attacker</text><path d="M1050 194V574" stroke="#C4C9D8" stroke-width="2" stroke-dasharray="7 7"/><path d="M150 235H590" stroke="#2F5BFF" stroke-width="3" fill="none" marker-end="url(#2F5BFF)"/><text x="365" y="223" fill="#2F5BFF" font-size="19" font-weight="600" text-anchor="middle">1. Refresh with RT1</text><path d="M600 300H160" stroke="#16A34A" stroke-width="3" fill="none" marker-end="url(#16A34A)"/><text x="370" y="288" fill="#16A34A" font-size="19" font-weight="600" text-anchor="middle">2. Mark RT1 used; issue RT2</text><path d="M1050 380H610" stroke="#DC2626" stroke-width="3" fill="none" marker-end="url(#DC2626)"/><text x="835" y="367" fill="#DC2626" font-size="19" font-weight="600" text-anchor="middle">3. Replay stolen RT1</text><rect x="465" y="410" width="270" height="80" rx="20" fill="#FFF1F2" stroke="#DC2626" stroke-width="2"/><text x="487" y="447" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Revoke token family</text><text x="487" y="479" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Reuse detected in the store</text><path d="M150 530H590" stroke="#2F5BFF" stroke-width="3" fill="none" marker-end="url(#2F5BFF)"/><text x="365" y="517" fill="#2F5BFF" font-size="19" font-weight="600" text-anchor="middle">4. Refresh with RT2</text><path d="M600 579H160" stroke="#DC2626" stroke-width="3" fill="none" marker-end="url(#DC2626)"/><text x="370" y="567" fill="#DC2626" font-size="19" font-weight="600" text-anchor="middle">5. Reject: family is revoked</text><text x="600" y="638" fill="#111827" font-size="20" font-weight="600" text-anchor="middle">The server cannot identify the legitimate holder. Both must sign in again.</text></svg>
