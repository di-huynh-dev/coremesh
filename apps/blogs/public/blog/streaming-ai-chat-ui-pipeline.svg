<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="title description"><title id="title">Streaming chat: data and cancellation</title><desc id="description">The LLM API streams through a route handler to an SSE parser, reducer and animation-frame-batched renderer. Stop triggers an AbortController and propagates cancellation to the upstream request.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F7F7FB"/><stop offset="1" stop-color="#EDEDF7"/></linearGradient><marker id="2F5BFF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F5BFF"/></marker><marker id="16A34A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16A34A"/></marker><marker id="DC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker><marker id="D97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><g opacity="0.4" stroke="#D8D8E8"><path d="M0 168H1200M0 336H1200M0 504H1200M200 0V675M400 0V675M600 0V675M800 0V675M1000 0V675"/></g><text x="40" y="61" fill="#111827" font-size="31" font-weight="800" text-anchor="start">Streaming chat: data and cancellation</text><text x="40" y="95" fill="#4B5563" font-size="18" font-weight="400" text-anchor="start">Data moves toward the UI. Cancellation travels back toward the model.</text><rect x="40" y="205" width="200" height="155" rx="20" fill="white" stroke="#2F5BFF" stroke-width="2"/><text x="62" y="242" fill="#111827" font-size="22" font-weight="700" text-anchor="start">LLM API</text><text x="62" y="274" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Token stream</text><path d="M240 280H262" stroke="#2F5BFF" stroke-width="3" fill="none" marker-end="url(#2F5BFF)"/><rect x="270" y="205" width="200" height="155" rx="20" fill="white" stroke="#2F5BFF" stroke-width="2"/><text x="292" y="242" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Route handler</text><text x="292" y="274" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Upstream fetch</text><text x="292" y="301" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">SSE response</text><path d="M470 280H492" stroke="#2F5BFF" stroke-width="3" fill="none" marker-end="url(#2F5BFF)"/><rect x="500" y="205" width="200" height="155" rx="20" fill="white" stroke="#2F5BFF" stroke-width="2"/><text x="522" y="242" fill="#111827" font-size="22" font-weight="700" text-anchor="start">SSE parser</text><text x="522" y="274" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Buffer chunks</text><text x="522" y="301" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Decode events</text><path d="M700 280H722" stroke="#2F5BFF" stroke-width="3" fill="none" marker-end="url(#2F5BFF)"/><rect x="730" y="205" width="200" height="155" rx="20" fill="white" stroke="#2F5BFF" stroke-width="2"/><text x="752" y="242" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Reducer</text><text x="752" y="274" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Apply deltas</text><text x="752" y="301" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Track status</text><path d="M930 280H952" stroke="#2F5BFF" stroke-width="3" fill="none" marker-end="url(#2F5BFF)"/><rect x="960" y="205" width="200" height="155" rx="20" fill="white" stroke="#16A34A" stroke-width="2"/><text x="982" y="242" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Render</text><text x="982" y="274" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Batch updates</text><text x="982" y="301" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Once per frame</text><text x="600" y="166" fill="#2F5BFF" font-size="17" font-weight="700" text-anchor="middle">DATA FLOW</text><rect x="960" y="435" width="200" height="85" rx="20" fill="#FFF1F2" stroke="#DC2626" stroke-width="2"/><text x="982" y="472" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Stop</text><text x="982" y="504" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">AbortController</text><path d="M1060 435V402H140V368" stroke="#DC2626" stroke-width="3" fill="none" stroke-dasharray="8 7" marker-end="url(#DC2626)"/><path d="M370 402V368" stroke="#DC2626" stroke-width="3" fill="none" stroke-dasharray="8 7" marker-end="url(#DC2626)"/><path d="M600 402V368" stroke="#DC2626" stroke-width="3" fill="none" stroke-dasharray="8 7" marker-end="url(#DC2626)"/><text x="455" y="440" fill="#DC2626" font-size="18" font-weight="600" text-anchor="middle">Propagate AbortSignal back to the upstream request</text><rect x="40" y="515" width="820" height="90" rx="20" fill="#EEF2FF" stroke="#2F5BFF" stroke-width="2"/><text x="62" y="552" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Handle stream states explicitly</text><text x="62" y="584" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Connecting → thinking → streaming → done / stopped / error</text><text x="40" y="646" fill="#111827" font-size="20" font-weight="600" text-anchor="start">Cancellation must stop network work, not only hide incoming text.</text></svg>
