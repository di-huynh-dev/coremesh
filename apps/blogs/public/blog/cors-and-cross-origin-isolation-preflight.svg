<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7FB"/>
      <stop offset="1" stop-color="#EDEDF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#16A34A"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2F5BFF"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <g opacity="0.45" stroke="#D8D8E8" stroke-width="2">
    <path d="M0 112H1200M0 224H1200M0 336H1200M0 448H1200M0 560H1200"/>
    <path d="M120 0V675M264 0V675M408 0V675M552 0V675M696 0V675M840 0V675M984 0V675M1128 0V675"/>
  </g>

  <text x="40" y="58" fill="#111827" font-size="32" font-weight="800">Preflight, then the real request</text>
  <text x="40" y="92" fill="#4B5563" font-size="18">A credentialed PUT from app.example.com to api.other.com, and which header answers which question.</text>

  <!-- lane headers -->
  <g filter="url(#shadow)">
    <rect x="30" y="116" width="160" height="58" rx="18" fill="white" stroke="#E5E7EF" stroke-width="2"/>
    <rect x="220" y="116" width="160" height="58" rx="18" fill="white" stroke="#2F5BFF" stroke-width="2.5"/>
    <rect x="600" y="116" width="180" height="58" rx="18" fill="white" stroke="#E5E7EF" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text x="110" y="140" fill="#111827" font-size="18" font-weight="700">Page</text>
    <text x="110" y="163" fill="#4B5563" font-size="16">app.example.com</text>
    <text x="300" y="140" fill="#111827" font-size="18" font-weight="700">Browser</text>
    <text x="300" y="163" fill="#4B5563" font-size="16">CORS checks</text>
    <text x="690" y="140" fill="#111827" font-size="18" font-weight="700">API</text>
    <text x="690" y="163" fill="#4B5563" font-size="16">api.other.com</text>
  </g>

  <!-- lifelines -->
  <path d="M110 176V590M300 176V590M690 176V590" stroke="#C7C9D9" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- 1. page -> browser -->
  <path d="M112 215H294" stroke="#9CA3AF" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="205" y="204" text-anchor="middle" fill="#374151" font-size="16" font-weight="600">PUT, JSON, cookies</text>

  <!-- 2. preflight -->
  <path d="M302 272H684" stroke="#2F5BFF" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <text x="495" y="261" text-anchor="middle" fill="#2F5BFF" font-size="16" font-weight="700">OPTIONS /orders/42 · Origin</text>
  <text x="495" y="294" text-anchor="middle" fill="#4B5563" font-size="16">Access-Control-Request-* · no cookies</text>

  <!-- 3. preflight response -->
  <path d="M688 340H306" stroke="#16A34A" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <text x="495" y="329" text-anchor="middle" fill="#16A34A" font-size="16" font-weight="700">204 · exact Origin · Allow-Credentials</text>
  <text x="495" y="362" text-anchor="middle" fill="#4B5563" font-size="16">Allow-Methods / -Headers · Max-Age</text>

  <!-- 4. actual request -->
  <path d="M302 420H684" stroke="#2F5BFF" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <text x="495" y="409" text-anchor="middle" fill="#2F5BFF" font-size="16" font-weight="700">PUT /orders/42 · Origin · Cookie</text>

  <!-- 5. actual response -->
  <path d="M688 488H306" stroke="#16A34A" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <text x="495" y="477" text-anchor="middle" fill="#16A34A" font-size="16" font-weight="700">200 · exact Origin · Allow-Credentials</text>
  <text x="495" y="510" text-anchor="middle" fill="#4B5563" font-size="16">Vary: Origin · Expose-Headers</text>

  <!-- 6. browser -> page -->
  <path d="M298 560H116" stroke="#16A34A" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <text x="205" y="549" text-anchor="middle" fill="#16A34A" font-size="16" font-weight="600">body readable</text>

  <!-- footnotes -->
  <text x="40" y="624" fill="#DC2626" font-size="16" font-weight="600">Preflight fails → the PUT is never sent; JS sees only a TypeError.</text>
  <text x="40" y="650" fill="#D97706" font-size="16" font-weight="600">Simple request → always sent and executed; only reading the response is blocked.</text>

  <!-- decision panel -->
  <g filter="url(#shadow)">
    <rect x="820" y="116" width="350" height="534" rx="24" fill="white" stroke="#E5E7EF" stroke-width="2"/>
  </g>
  <text x="844" y="156" fill="#111827" font-size="22" font-weight="800">Which header?</text>
  <path d="M844 262H1146M844 354H1146M844 446H1146M844 538H1146" stroke="#EEF0F5" stroke-width="2"/>

  <text x="844" y="200" fill="#4B5563" font-size="16">Let another origin read my response</text>
  <text x="844" y="230" fill="#2F5BFF" font-size="18" font-weight="700">CORS · Access-Control-*</text>

  <text x="844" y="292" fill="#4B5563" font-size="16">Stop others embedding my resource</text>
  <text x="844" y="322" fill="#7C3AED" font-size="18" font-weight="700">CORP</text>

  <text x="844" y="384" fill="#4B5563" font-size="16">Need SharedArrayBuffer</text>
  <text x="844" y="414" fill="#D97706" font-size="18" font-weight="700">COOP + COEP</text>

  <text x="844" y="476" fill="#4B5563" font-size="16">Reject cross-site requests</text>
  <text x="844" y="506" fill="#DC2626" font-size="18" font-weight="700">Fetch Metadata · Sec-Fetch-*</text>

  <text x="844" y="568" fill="#4B5563" font-size="16">Keep cookies off cross-site requests</text>
  <text x="844" y="598" fill="#16A34A" font-size="18" font-weight="700">SameSite=Lax / Strict</text>
</svg>
