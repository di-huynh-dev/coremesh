<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7FB"/>
      <stop offset="1" stop-color="#EDEDF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <g opacity="0.4" stroke="#D8D8E8" stroke-width="2">
    <path d="M0 135H1200M0 270H1200M0 405H1200M0 540H1200M200 0V675M400 0V675M600 0V675M800 0V675M1000 0V675"/>
  </g>

  <text x="30" y="68" fill="#111827" font-size="34" font-weight="800">Layered defenses for npm dependencies</text>
  <text x="30" y="104" fill="#4B5563" font-size="20">Each layer cuts part of the chain; the bottom layer assumes they fail</text>

  <!-- Install column -->
  <g filter="url(#shadow)">
    <rect x="30" y="135" width="360" height="335" rx="24" fill="white" stroke="#E5E7EF"/>
  </g>
  <rect x="30" y="135" width="360" height="8" rx="4" fill="#2F5BFF"/>
  <text x="56" y="182" fill="#2F5BFF" font-size="24" font-weight="800">INSTALL</text>
  <text x="56" y="210" fill="#4B5563" font-size="18">cuts steps 2 and 3</text>
  <rect x="50" y="232" width="320" height="46" rx="12" fill="#F3F5FF"/>
  <text x="70" y="262" fill="#111827" font-size="19" font-weight="600">Lockfile + frozen install</text>
  <rect x="50" y="288" width="320" height="46" rx="12" fill="#F3F5FF"/>
  <text x="70" y="318" fill="#111827" font-size="19" font-weight="600">Install scripts blocked</text>
  <rect x="50" y="344" width="320" height="46" rx="12" fill="#F3F5FF"/>
  <text x="70" y="374" fill="#111827" font-size="19" font-weight="600">Cooldown of 3–7 days</text>
  <rect x="50" y="400" width="320" height="46" rx="12" fill="#F3F5FF"/>
  <text x="70" y="430" fill="#111827" font-size="19" font-weight="600">Short build allow-list</text>

  <!-- CI column -->
  <g filter="url(#shadow)">
    <rect x="420" y="135" width="360" height="335" rx="24" fill="white" stroke="#E5E7EF"/>
  </g>
  <rect x="420" y="135" width="360" height="8" rx="4" fill="#7C3AED"/>
  <text x="446" y="182" fill="#7C3AED" font-size="24" font-weight="800">CI</text>
  <text x="446" y="210" fill="#4B5563" font-size="18">cuts steps 1, 3 and 4</text>
  <rect x="440" y="232" width="320" height="46" rx="12" fill="#F6F2FF"/>
  <text x="460" y="262" fill="#111827" font-size="19" font-weight="600">Actions pinned to SHA</text>
  <rect x="440" y="288" width="320" height="46" rx="12" fill="#F6F2FF"/>
  <text x="460" y="318" fill="#111827" font-size="19" font-weight="600">Read-only permissions</text>
  <rect x="440" y="344" width="320" height="46" rx="12" fill="#F6F2FF"/>
  <text x="460" y="374" fill="#111827" font-size="19" font-weight="600">No pull_request_target</text>
  <rect x="440" y="400" width="320" height="46" rx="12" fill="#F6F2FF"/>
  <text x="460" y="430" fill="#111827" font-size="19" font-weight="600">OIDC, no stored tokens</text>

  <!-- Publish column -->
  <g filter="url(#shadow)">
    <rect x="810" y="135" width="360" height="335" rx="24" fill="white" stroke="#E5E7EF"/>
  </g>
  <rect x="810" y="135" width="360" height="8" rx="4" fill="#16A34A"/>
  <text x="836" y="182" fill="#16A34A" font-size="24" font-weight="800">PUBLISH</text>
  <text x="836" y="210" fill="#4B5563" font-size="18">cuts steps 1 and 5</text>
  <rect x="830" y="232" width="320" height="46" rx="12" fill="#F0FBF4"/>
  <text x="850" y="262" fill="#111827" font-size="19" font-weight="600">Trusted publishing</text>
  <rect x="830" y="288" width="320" height="46" rx="12" fill="#F0FBF4"/>
  <text x="850" y="318" fill="#111827" font-size="19" font-weight="600">Tokens disallowed</text>
  <rect x="830" y="344" width="320" height="46" rx="12" fill="#F0FBF4"/>
  <text x="850" y="374" fill="#111827" font-size="19" font-weight="600">Reviewer-gated release</text>
  <rect x="830" y="400" width="320" height="46" rx="12" fill="#F0FBF4"/>
  <text x="850" y="430" fill="#111827" font-size="19" font-weight="600">Passkey 2FA on GitHub</text>

  <!-- Connectors -->
  <path d="M210 474V506" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M600 474V506" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M990 474V506" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Detect and respond -->
  <g filter="url(#shadow)">
    <rect x="30" y="515" width="1140" height="120" rx="24" fill="white" stroke="#E5E7EF"/>
  </g>
  <rect x="30" y="515" width="8" height="120" rx="4" fill="#D97706"/>
  <text x="62" y="566" fill="#D97706" font-size="24" font-weight="800">DETECT &amp; RESPOND</text>
  <text x="62" y="596" fill="#4B5563" font-size="18">when a layer fails</text>
  <rect x="360" y="545" width="230" height="60" rx="14" fill="#FFF7EB"/>
  <text x="475" y="582" text-anchor="middle" fill="#111827" font-size="19" font-weight="600">SBOM per build</text>
  <rect x="610" y="545" width="270" height="60" rx="14" fill="#FFF7EB"/>
  <text x="745" y="582" text-anchor="middle" fill="#111827" font-size="19" font-weight="600">OSV + behavior scans</text>
  <rect x="900" y="545" width="250" height="60" rx="14" fill="#FFF7EB"/>
  <text x="1025" y="582" text-anchor="middle" fill="#111827" font-size="19" font-weight="600">Incident playbook</text>
</svg>
