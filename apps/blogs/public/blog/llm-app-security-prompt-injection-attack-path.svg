<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="title description"><title id="title">Indirect prompt injection: the attack path</title><desc id="description">An attacker-controlled email reaches a support agent with access to private data. Unsafe output can leak data through an image URL; a tool request can also attempt a refund.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F7F7FB"/><stop offset="1" stop-color="#EDEDF7"/></linearGradient><marker id="2F5BFF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F5BFF"/></marker><marker id="16A34A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16A34A"/></marker><marker id="DC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker><marker id="D97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><g opacity="0.4" stroke="#D8D8E8"><path d="M0 168H1200M0 336H1200M0 504H1200M200 0V675M400 0V675M600 0V675M800 0V675M1000 0V675"/></g><text x="40" y="61" fill="#111827" font-size="31" font-weight="800" text-anchor="start">Indirect prompt injection: the attack path</text><text x="40" y="95" fill="#4B5563" font-size="18" font-weight="400" text-anchor="start">Retrieved content is data. It must never inherit system or user authority.</text><rect x="40" y="160" width="275" height="145" rx="20" fill="#FFF1F2" stroke="#DC2626" stroke-width="2"/><text x="62" y="197" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Untrusted email</text><text x="62" y="229" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Attacker hides instructions</text><text x="62" y="256" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">inside retrieved content</text><rect x="410" y="160" width="345" height="145" rx="20" fill="#EEF2FF" stroke="#2F5BFF" stroke-width="2"/><text x="432" y="197" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Support agent</text><text x="432" y="229" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Model reads email + orders</text><text x="432" y="256" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Content is mistaken for authority</text><rect x="860" y="160" width="300" height="145" rx="20" fill="#FFF7ED" stroke="#D97706" stroke-width="2"/><text x="882" y="197" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Private data</text><text x="882" y="229" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Inbox, customer records</text><text x="882" y="256" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Order and refund details</text><path d="M315 232H402" stroke="#DC2626" stroke-width="3" fill="none" marker-end="url(#DC2626)"/><path d="M860 232H763" stroke="#D97706" stroke-width="3" fill="none" marker-end="url(#D97706)"/><rect x="175" y="405" width="355" height="135" rx="20" fill="#FFF1F2" stroke="#DC2626" stroke-width="2"/><text x="197" y="442" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Data exfiltration</text><text x="197" y="474" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Markdown image URL contains data</text><text x="197" y="501" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Remote host receives the request</text><rect x="660" y="405" width="355" height="135" rx="20" fill="#FFF1F2" stroke="#DC2626" stroke-width="2"/><text x="682" y="442" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Unauthorized action</text><text x="682" y="474" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Agent proposes a refund tool call</text><text x="682" y="501" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Server-side policy must decide</text><path d="M525 305V353H352V397" stroke="#DC2626" stroke-width="3" fill="none" marker-end="url(#DC2626)"/><path d="M640 305V353H837V397" stroke="#DC2626" stroke-width="3" fill="none" marker-end="url(#DC2626)"/><text x="600" y="603" fill="#111827" font-size="24" font-weight="700" text-anchor="middle">Untrusted content + private data + an outbound channel</text><text x="600" y="636" fill="#4B5563" font-size="18" font-weight="400" text-anchor="middle">Remove a necessary leg of the exfiltration path; constrain tool actions separately.</text></svg>
