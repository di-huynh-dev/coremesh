<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7FB"/>
      <stop offset="1" stop-color="#EDEDF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <g opacity="0.45" stroke="#D8D8E8" stroke-width="2">
    <path d="M0 112H1200M0 224H1200M0 336H1200M0 448H1200M0 560H1200"/>
    <path d="M120 0V675M264 0V675M408 0V675M552 0V675M696 0V675M840 0V675M984 0V675M1128 0V675"/>
  </g>

  <text x="40" y="52" fill="#111827" font-size="32" font-weight="800">Key rotation with JWKS overlap windows</text>
  <text x="40" y="84" fill="#4B5563" font-size="18">Publish before signing, keep after retiring: verifier caches and live tokens are always covered.</text>

  <!-- overlap windows -->
  <rect x="250" y="152" width="180" height="370" fill="#2F5BFF" opacity="0.08"/>
  <rect x="430" y="152" width="180" height="370" fill="#D97706" opacity="0.09"/>
  <rect x="760" y="152" width="180" height="370" fill="#2F5BFF" opacity="0.08"/>
  <rect x="940" y="152" width="180" height="370" fill="#D97706" opacity="0.09"/>
  <text x="340" y="140" text-anchor="middle" fill="#2F5BFF" font-size="16" font-weight="700">≥ JWKS cache</text>
  <text x="520" y="140" text-anchor="middle" fill="#D97706" font-size="16" font-weight="700">≥ token age + skew</text>
  <text x="850" y="140" text-anchor="middle" fill="#2F5BFF" font-size="16" font-weight="700">≥ JWKS cache</text>
  <text x="1030" y="140" text-anchor="middle" fill="#D97706" font-size="16" font-weight="700">≥ token age + skew</text>

  <!-- signer switch lines -->
  <g stroke="#6B7280" stroke-width="2" stroke-dasharray="6 6">
    <path d="M430 152V550"/>
    <path d="M940 152V550"/>
  </g>

  <!-- row labels -->
  <text x="40" y="207" fill="#111827" font-size="20" font-weight="800">K1</text>
  <text x="40" y="277" fill="#111827" font-size="20" font-weight="800">K2</text>
  <text x="40" y="347" fill="#111827" font-size="20" font-weight="800">K3</text>
  <text x="40" y="427" fill="#111827" font-size="18" font-weight="700">Signs with</text>
  <text x="40" y="497" fill="#111827" font-size="18" font-weight="700">JWKS</text>

  <!-- K1 -->
  <g filter="url(#shadow)">
    <rect x="170" y="180" width="258" height="40" rx="10" fill="#E8F7EE" stroke="#16A34A" stroke-width="2"/>
    <rect x="432" y="180" width="178" height="40" rx="10" fill="#FEF3E2" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="299" y="206" text-anchor="middle" fill="#15803D" font-size="16" font-weight="700">active · signs</text>
  <text x="521" y="206" text-anchor="middle" fill="#B45309" font-size="16" font-weight="700">retiring</text>

  <!-- K2 -->
  <g filter="url(#shadow)">
    <rect x="250" y="250" width="178" height="40" rx="10" fill="#EAF0FF" stroke="#2F5BFF" stroke-width="2"/>
    <rect x="432" y="250" width="506" height="40" rx="10" fill="#E8F7EE" stroke="#16A34A" stroke-width="2"/>
    <rect x="942" y="250" width="178" height="40" rx="10" fill="#FEF3E2" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="339" y="276" text-anchor="middle" fill="#2F5BFF" font-size="16" font-weight="700">published</text>
  <text x="685" y="276" text-anchor="middle" fill="#15803D" font-size="16" font-weight="700">active · signs</text>
  <text x="1031" y="276" text-anchor="middle" fill="#B45309" font-size="16" font-weight="700">retiring</text>

  <!-- K3 -->
  <g filter="url(#shadow)">
    <rect x="760" y="320" width="178" height="40" rx="10" fill="#EAF0FF" stroke="#2F5BFF" stroke-width="2"/>
    <rect x="942" y="320" width="218" height="40" rx="10" fill="#E8F7EE" stroke="#16A34A" stroke-width="2"/>
  </g>
  <text x="849" y="346" text-anchor="middle" fill="#2F5BFF" font-size="16" font-weight="700">published</text>
  <text x="1051" y="346" text-anchor="middle" fill="#15803D" font-size="16" font-weight="700">active · signs</text>

  <!-- signs with -->
  <g filter="url(#shadow)">
    <rect x="170" y="400" width="258" height="40" rx="10" fill="white" stroke="#16A34A" stroke-width="2"/>
    <rect x="432" y="400" width="506" height="40" rx="10" fill="white" stroke="#16A34A" stroke-width="2"/>
    <rect x="942" y="400" width="218" height="40" rx="10" fill="white" stroke="#16A34A" stroke-width="2"/>
  </g>
  <text x="299" y="426" text-anchor="middle" fill="#15803D" font-size="17" font-weight="700">K1</text>
  <text x="685" y="426" text-anchor="middle" fill="#15803D" font-size="17" font-weight="700">K2</text>
  <text x="1051" y="426" text-anchor="middle" fill="#15803D" font-size="17" font-weight="700">K3</text>

  <!-- JWKS contents -->
  <g filter="url(#shadow)">
    <rect x="170" y="470" width="78" height="40" rx="10" fill="white" stroke="#9CA3AF" stroke-width="2"/>
    <rect x="252" y="470" width="356" height="40" rx="10" fill="white" stroke="#9CA3AF" stroke-width="2"/>
    <rect x="612" y="470" width="146" height="40" rx="10" fill="white" stroke="#9CA3AF" stroke-width="2"/>
    <rect x="762" y="470" width="356" height="40" rx="10" fill="white" stroke="#9CA3AF" stroke-width="2"/>
    <rect x="1122" y="470" width="38" height="40" rx="10" fill="white" stroke="#9CA3AF" stroke-width="2"/>
  </g>
  <text x="209" y="496" text-anchor="middle" fill="#374151" font-size="17" font-weight="700">K1</text>
  <text x="430" y="496" text-anchor="middle" fill="#374151" font-size="17" font-weight="700">K1 + K2</text>
  <text x="685" y="496" text-anchor="middle" fill="#374151" font-size="17" font-weight="700">K2</text>
  <text x="940" y="496" text-anchor="middle" fill="#374151" font-size="17" font-weight="700">K2 + K3</text>
  <text x="1141" y="496" text-anchor="middle" fill="#374151" font-size="16" font-weight="700">K3</text>

  <!-- time axis -->
  <path d="M170 552H1166" stroke="#6B7280" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g stroke="#6B7280" stroke-width="3" stroke-linecap="round">
    <path d="M250 544V560"/>
    <path d="M430 544V560"/>
    <path d="M610 544V560"/>
    <path d="M760 544V560"/>
    <path d="M940 544V560"/>
    <path d="M1120 544V560"/>
  </g>
  <g font-size="16" font-weight="600" text-anchor="middle">
    <text x="250" y="582" fill="#2F5BFF">publish K2</text>
    <text x="430" y="582" fill="#15803D">activate K2</text>
    <text x="610" y="582" fill="#B45309">remove K1</text>
    <text x="760" y="582" fill="#2F5BFF">publish K3</text>
    <text x="940" y="582" fill="#15803D">activate K3</text>
    <text x="1120" y="582" fill="#B45309">remove K2</text>
  </g>

  <!-- legend -->
  <rect x="40" y="618" width="30" height="20" rx="6" fill="#EAF0FF" stroke="#2F5BFF" stroke-width="2"/>
  <text x="80" y="634" fill="#4B5563" font-size="16">published: verify only</text>
  <rect x="290" y="618" width="30" height="20" rx="6" fill="#E8F7EE" stroke="#16A34A" stroke-width="2"/>
  <text x="330" y="634" fill="#4B5563" font-size="16">active: signs new tokens</text>
  <rect x="555" y="618" width="30" height="20" rx="6" fill="#FEF3E2" stroke="#D97706" stroke-width="2"/>
  <text x="595" y="634" fill="#4B5563" font-size="16">retiring: verify only</text>
  <text x="1160" y="634" text-anchor="end" fill="#DC2626" font-size="16" font-weight="700">Leaked key: remove at once, force re-login</text>
</svg>
