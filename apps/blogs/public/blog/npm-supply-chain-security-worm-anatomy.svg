<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7FB"/>
      <stop offset="1" stop-color="#EDEDF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <g opacity="0.4" stroke="#D8D8E8" stroke-width="2">
    <path d="M0 135H1200M0 405H1200M0 540H1200M200 0V675M400 0V675M600 0V675M800 0V675M1000 0V675"/>
  </g>

  <text x="30" y="68" fill="#111827" font-size="34" font-weight="800">Anatomy of a worm-style compromise</text>
  <text x="30" y="104" fill="#4B5563" font-size="20">Every stolen token restarts the loop in a new place</text>

  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="30" y="150" width="340" height="170" rx="24" fill="white" stroke="#E5E7EF"/>
  </g>
  <circle cx="68" cy="190" r="20" fill="#DC2626"/>
  <text x="68" y="197" text-anchor="middle" fill="white" font-size="20" font-weight="700">1</text>
  <text x="102" y="198" fill="#111827" font-size="22" font-weight="700">Account takeover</text>
  <text x="54" y="252" fill="#4B5563" font-size="19">Phished maintainer,</text>
  <text x="54" y="280" fill="#4B5563" font-size="19">CI exploit or old token</text>

  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="430" y="150" width="340" height="170" rx="24" fill="white" stroke="#E5E7EF"/>
  </g>
  <circle cx="468" cy="190" r="20" fill="#D97706"/>
  <text x="468" y="197" text-anchor="middle" fill="white" font-size="20" font-weight="700">2</text>
  <text x="502" y="198" fill="#111827" font-size="22" font-weight="700">Malicious version</text>
  <text x="454" y="252" fill="#4B5563" font-size="19">Patch or minor bump</text>
  <text x="454" y="280" fill="#4B5563" font-size="19">that matches ^ ranges</text>

  <!-- Card 3 -->
  <g filter="url(#shadow)">
    <rect x="830" y="150" width="340" height="170" rx="24" fill="white" stroke="#E5E7EF"/>
  </g>
  <circle cx="868" cy="190" r="20" fill="#7C3AED"/>
  <text x="868" y="197" text-anchor="middle" fill="white" font-size="20" font-weight="700">3</text>
  <text x="902" y="198" fill="#111827" font-size="22" font-weight="700">Install hook runs</text>
  <text x="854" y="252" fill="#4B5563" font-size="19">preinstall / postinstall</text>
  <text x="854" y="280" fill="#4B5563" font-size="19">with full user rights</text>

  <!-- Card 4 -->
  <g filter="url(#shadow)">
    <rect x="830" y="440" width="340" height="170" rx="24" fill="white" stroke="#E5E7EF"/>
  </g>
  <circle cx="868" cy="480" r="20" fill="#DC2626"/>
  <text x="868" y="487" text-anchor="middle" fill="white" font-size="20" font-weight="700">4</text>
  <text x="902" y="488" fill="#111827" font-size="22" font-weight="700">Secrets stolen</text>
  <text x="854" y="542" fill="#4B5563" font-size="19">npm, GitHub, cloud keys</text>
  <text x="854" y="570" fill="#4B5563" font-size="19">pushed to public repos</text>

  <!-- Card 5 -->
  <g filter="url(#shadow)">
    <rect x="430" y="440" width="340" height="170" rx="24" fill="white" stroke="#E5E7EF"/>
  </g>
  <circle cx="468" cy="480" r="20" fill="#2F5BFF"/>
  <text x="468" y="487" text-anchor="middle" fill="white" font-size="20" font-weight="700">5</text>
  <text x="502" y="488" fill="#111827" font-size="22" font-weight="700">Self-publish</text>
  <text x="454" y="542" fill="#4B5563" font-size="19">Stolen npm token infects</text>
  <text x="454" y="570" fill="#4B5563" font-size="19">the victim's packages</text>

  <!-- Legend card -->
  <g filter="url(#shadow)">
    <rect x="30" y="440" width="340" height="170" rx="24" fill="white" stroke="#E5E7EF"/>
  </g>
  <text x="54" y="476" fill="#16A34A" font-size="20" font-weight="700">Where to cut each link</text>
  <text x="54" y="506" fill="#4B5563" font-size="18">1 · phishing-proof 2FA</text>
  <text x="54" y="528" fill="#4B5563" font-size="18">2 · lockfile + cooldown</text>
  <text x="54" y="550" fill="#4B5563" font-size="18">3 · install scripts off</text>
  <text x="54" y="572" fill="#4B5563" font-size="18">4 · least-privilege CI</text>
  <text x="54" y="594" fill="#4B5563" font-size="18">5 · trusted publishing</text>

  <!-- Arrows -->
  <path d="M374 235H422" stroke="#9CA3AF" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M774 235H822" stroke="#9CA3AF" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1000 324V432" stroke="#9CA3AF" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M826 525H778" stroke="#9CA3AF" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M600 436V328" stroke="#DC2626" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12" marker-end="url(#arrowRed)"/>
  <text x="622" y="372" fill="#DC2626" font-size="19" font-weight="700">Loop: new victim,</text>
  <text x="622" y="398" fill="#DC2626" font-size="19" font-weight="700">same chain</text>
</svg>
