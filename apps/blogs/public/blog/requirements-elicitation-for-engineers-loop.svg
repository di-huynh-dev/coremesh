<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7FB"/>
      <stop offset="1" stop-color="#EDEDF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2F5BFF"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#D97706"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <g opacity="0.45" stroke="#D8D8E8" stroke-width="2">
    <path d="M0 112H1200M0 224H1200M0 336H1200M0 448H1200M0 560H1200"/>
    <path d="M120 0V675M264 0V675M408 0V675M552 0V675M696 0V675M840 0V675M984 0V675M1128 0V675"/>
  </g>

  <text x="40" y="62" fill="#111827" font-size="34" font-weight="800">The elicitation loop</text>
  <text x="40" y="98" fill="#4B5563" font-size="18">Go around more than once, and pick the technique by who you are listening to.</text>

  <!-- loop nodes -->
  <g filter="url(#shadow)">
    <rect x="240" y="136" width="180" height="72" rx="20" fill="white" stroke="#2F5BFF" stroke-width="2.5"/>
  </g>
  <text x="330" y="166" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">1. Prepare</text>
  <text x="330" y="192" text-anchor="middle" fill="#4B5563" font-size="16">goals · who · assumptions</text>

  <g filter="url(#shadow)">
    <rect x="450" y="284" width="180" height="72" rx="20" fill="white" stroke="#2F5BFF" stroke-width="2.5"/>
  </g>
  <text x="540" y="314" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">2. Elicit</text>
  <text x="540" y="340" text-anchor="middle" fill="#4B5563" font-size="16">ask · watch · read</text>

  <g filter="url(#shadow)">
    <rect x="375" y="520" width="180" height="72" rx="20" fill="white" stroke="#2F5BFF" stroke-width="2.5"/>
  </g>
  <text x="465" y="550" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">3. Document</text>
  <text x="465" y="576" text-anchor="middle" fill="#4B5563" font-size="16">notes · logs · models</text>

  <g filter="url(#shadow)">
    <rect x="105" y="520" width="180" height="72" rx="20" fill="white" stroke="#16A34A" stroke-width="2.5"/>
  </g>
  <text x="195" y="550" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">4. Confirm</text>
  <text x="195" y="576" text-anchor="middle" fill="#4B5563" font-size="16">playback · glossary</text>

  <g filter="url(#shadow)">
    <rect x="30" y="284" width="180" height="72" rx="20" fill="white" stroke="#D97706" stroke-width="2.5"/>
  </g>
  <text x="120" y="314" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">5. Refine</text>
  <text x="120" y="340" text-anchor="middle" fill="#4B5563" font-size="16">gaps · new questions</text>

  <!-- loop arrows -->
  <path d="M422 176Q520 190 536 276" stroke="#2F5BFF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M552 358Q560 450 500 512" stroke="#2F5BFF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M373 556H293" stroke="#2F5BFF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M160 518Q100 450 112 364" stroke="#D97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowAmber)"/>
  <path d="M124 282Q140 190 232 176" stroke="#D97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowAmber)"/>

  <text x="330" y="398" text-anchor="middle" fill="#4B5563" font-size="18" font-weight="600">Stop looping when</text>
  <text x="330" y="424" text-anchor="middle" fill="#4B5563" font-size="18" font-weight="600">new sessions stop</text>
  <text x="330" y="450" text-anchor="middle" fill="#4B5563" font-size="18" font-weight="600">changing the model</text>

  <!-- techniques panel -->
  <rect x="660" y="124" width="510" height="508" rx="24" fill="white" fill-opacity="0.6" stroke="#E5E7EF" stroke-width="2"/>
  <text x="684" y="160" fill="#111827" font-size="20" font-weight="700">Who you talk to → how you listen</text>

  <rect x="684" y="180" width="200" height="72" rx="16" fill="#EEF2FF" stroke="#2F5BFF" stroke-width="2"/>
  <text x="784" y="210" text-anchor="middle" fill="#2F5BFF" font-size="18" font-weight="700">Sponsor / exec</text>
  <text x="784" y="234" text-anchor="middle" fill="#4B5563" font-size="16">decides, funds</text>
  <text x="900" y="210" fill="#111827" font-size="17">Short interview, laddering</text>
  <text x="900" y="234" fill="#4B5563" font-size="17">business case, success metric</text>

  <rect x="684" y="266" width="200" height="72" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="784" y="296" text-anchor="middle" fill="#7C3AED" font-size="18" font-weight="700">Process owner</text>
  <text x="784" y="320" text-anchor="middle" fill="#4B5563" font-size="16">knows the rules</text>
  <text x="900" y="296" fill="#111827" font-size="17">Interview + document analysis</text>
  <text x="900" y="320" fill="#4B5563" font-size="17">policy, SOP, approval matrix</text>

  <rect x="684" y="352" width="200" height="72" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="2"/>
  <text x="784" y="382" text-anchor="middle" fill="#16A34A" font-size="18" font-weight="700">Day-to-day users</text>
  <text x="784" y="406" text-anchor="middle" fill="#4B5563" font-size="16">do the actual work</text>
  <text x="900" y="382" fill="#111827" font-size="17">Shadowing, “show me how”</text>
  <text x="900" y="406" fill="#4B5563" font-size="17">contextual inquiry, prototypes</text>

  <rect x="684" y="438" width="200" height="72" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="784" y="468" text-anchor="middle" fill="#D97706" font-size="18" font-weight="700">Control functions</text>
  <text x="784" y="492" text-anchor="middle" fill="#4B5563" font-size="16">finance · audit · IT</text>
  <text x="900" y="468" fill="#111827" font-size="17">Workshop, NFR checklist</text>
  <text x="900" y="492" fill="#4B5563" font-size="17">regulations, system docs</text>

  <rect x="684" y="524" width="200" height="72" rx="16" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="784" y="554" text-anchor="middle" fill="#DC2626" font-size="18" font-weight="700">External parties</text>
  <text x="784" y="578" text-anchor="middle" fill="#4B5563" font-size="16">suppliers, customers</text>
  <text x="900" y="554" fill="#111827" font-size="17">Sample documents and data</text>
  <text x="900" y="578" fill="#4B5563" font-size="17">JTBD interviews if reachable</text>
</svg>
