<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7FB"/>
      <stop offset="1" stop-color="#EDEDF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2F5BFF"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#16A34A"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#D97706"/>
    </marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7C3AED"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>

  <text x="40" y="62" fill="#111827" font-size="34" font-weight="800">One tool call, end to end</text>

  <!-- Lifeline headers -->
  <g filter="url(#shadow)">
    <rect x="50" y="88" width="220" height="56" rx="20" fill="white" stroke="#7C3AED" stroke-width="2"/>
    <rect x="340" y="88" width="220" height="56" rx="20" fill="white" stroke="#2F5BFF" stroke-width="2"/>
    <rect x="640" y="88" width="220" height="56" rx="20" fill="white" stroke="#E5E7EF" stroke-width="2"/>
    <rect x="930" y="88" width="220" height="56" rx="20" fill="white" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="160" y="124" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">Model</text>
  <text x="450" y="124" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">Host / client</text>
  <text x="750" y="124" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">MCP server</text>
  <text x="1040" y="124" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">Postgres</text>

  <g stroke="#C7C7D8" stroke-width="3" stroke-dasharray="8 8">
    <path d="M160 144V645"/>
    <path d="M450 144V645"/>
    <path d="M750 144V645"/>
    <path d="M1040 144V645"/>
  </g>

  <!-- 1: tools/list -->
  <path d="M452 200H744" stroke="#2F5BFF" stroke-width="4" marker-end="url(#a)"/>
  <circle cx="530" cy="180" r="14" fill="#2F5BFF"/>
  <text x="530" y="186" text-anchor="middle" fill="white" font-size="18" font-weight="700">1</text>
  <text x="556" y="187" fill="#111827" font-size="20" font-weight="600">tools/list</text>
  <path d="M748 250H456" stroke="#16A34A" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#r)"/>
  <text x="600" y="238" text-anchor="middle" fill="#4B5563" font-size="18">names, descriptions, schemas</text>

  <!-- 2: definitions to model -->
  <path d="M448 300H166" stroke="#7C3AED" stroke-width="4" marker-end="url(#m)"/>
  <circle cx="200" cy="280" r="14" fill="#7C3AED"/>
  <text x="200" y="286" text-anchor="middle" fill="white" font-size="18" font-weight="700">2</text>
  <text x="224" y="287" fill="#111827" font-size="20" font-weight="600">tool definitions</text>

  <!-- 3: model proposes a call -->
  <path d="M162 350H444" stroke="#7C3AED" stroke-width="4" marker-end="url(#m)"/>
  <circle cx="200" cy="330" r="14" fill="#7C3AED"/>
  <text x="200" y="336" text-anchor="middle" fill="white" font-size="18" font-weight="700">3</text>
  <text x="224" y="337" fill="#111827" font-size="20" font-weight="600">get_order(SO-104233)</text>

  <!-- 4: tools/call and query -->
  <path d="M452 400H744" stroke="#2F5BFF" stroke-width="4" marker-end="url(#a)"/>
  <circle cx="530" cy="380" r="14" fill="#2F5BFF"/>
  <text x="530" y="386" text-anchor="middle" fill="white" font-size="18" font-weight="700">4</text>
  <text x="556" y="387" fill="#111827" font-size="20" font-weight="600">tools/call</text>
  <path d="M752 440H1034" stroke="#D97706" stroke-width="4" marker-end="url(#o)"/>
  <text x="895" y="428" text-anchor="middle" fill="#111827" font-size="20" font-weight="600">SELECT (read-only)</text>
  <path d="M1038 485H756" stroke="#16A34A" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#r)"/>
  <text x="895" y="473" text-anchor="middle" fill="#4B5563" font-size="18">rows</text>

  <!-- 5: result back to the model -->
  <path d="M748 535H456" stroke="#16A34A" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#r)"/>
  <circle cx="530" cy="515" r="14" fill="#16A34A"/>
  <text x="530" y="521" text-anchor="middle" fill="white" font-size="18" font-weight="700">5</text>
  <text x="556" y="522" fill="#111827" font-size="20" font-weight="600">result or isError</text>
  <path d="M448 580H166" stroke="#16A34A" stroke-width="4" marker-end="url(#r)"/>
  <text x="307" y="568" text-anchor="middle" fill="#4B5563" font-size="18">content in context</text>

  <!-- Answer -->
  <rect x="60" y="604" width="200" height="44" rx="16" fill="#F3F0FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="160" y="633" text-anchor="middle" fill="#111827" font-size="18" font-weight="600">answers the user</text>
</svg>
