<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="title description"><title id="title">Agent security: independent defense layers</title><desc id="description">Input, model, tool and output controls surround the agent loop. Tool results return as untrusted input. Monitoring covers the loop and sensitive actions require explicit approval.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F7F7FB"/><stop offset="1" stop-color="#EDEDF7"/></linearGradient><marker id="2F5BFF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F5BFF"/></marker><marker id="16A34A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16A34A"/></marker><marker id="DC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker><marker id="D97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><g opacity="0.4" stroke="#D8D8E8"><path d="M0 168H1200M0 336H1200M0 504H1200M200 0V675M400 0V675M600 0V675M800 0V675M1000 0V675"/></g><text x="40" y="61" fill="#111827" font-size="31" font-weight="800" text-anchor="start">Agent security: independent defense layers</text><text x="40" y="95" fill="#4B5563" font-size="18" font-weight="400" text-anchor="start">Enforce permissions in application code, outside the model.</text><rect x="40" y="190" width="245" height="160" rx="20" fill="white" stroke="#2F5BFF" stroke-width="2"/><text x="62" y="227" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Input boundary</text><text x="62" y="259" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Track source and trust</text><text x="62" y="286" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Limit retrieved scope</text><text x="62" y="313" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Treat tool output as data</text><rect x="330" y="190" width="245" height="160" rx="20" fill="white" stroke="#2F5BFF" stroke-width="2"/><text x="352" y="227" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Model boundary</text><text x="352" y="259" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Separate instructions</text><text x="352" y="286" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">from external content</text><text x="352" y="313" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Assume this layer can fail</text><rect x="620" y="190" width="245" height="160" rx="20" fill="white" stroke="#16A34A" stroke-width="2"/><text x="642" y="227" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Tool gateway</text><text x="642" y="259" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Authorize every call</text><text x="642" y="286" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Validate arguments</text><text x="642" y="313" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Use scoped credentials</text><rect x="910" y="190" width="250" height="160" rx="20" fill="white" stroke="#D97706" stroke-width="2"/><text x="932" y="227" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Output boundary</text><text x="932" y="259" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Escape rendered content</text><text x="932" y="286" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Constrain outbound URLs</text><text x="932" y="313" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Check sensitive results</text><path d="M285 270H322" stroke="#2F5BFF" stroke-width="3" fill="none" marker-end="url(#2F5BFF)"/><path d="M575 270H612" stroke="#2F5BFF" stroke-width="3" fill="none" marker-end="url(#2F5BFF)"/><path d="M865 270H902" stroke="#2F5BFF" stroke-width="3" fill="none" marker-end="url(#2F5BFF)"/><path d="M742 350V407H452V358" stroke="#D97706" stroke-width="3" fill="none" stroke-dasharray="8 7" marker-end="url(#D97706)"/><text x="598" y="435" fill="#D97706" font-size="18" font-weight="600" text-anchor="middle">Tool results return as untrusted input</text><rect x="620" y="470" width="540" height="100" rx="20" fill="#ECFDF3" stroke="#16A34A" stroke-width="2"/><text x="642" y="507" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Approval for sensitive actions</text><text x="642" y="539" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Bind approval to the exact action and its arguments</text><rect x="40" y="470" width="535" height="100" rx="20" fill="#EEF2FF" stroke="#2F5BFF" stroke-width="2"/><text x="62" y="507" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Monitoring across the entire loop</text><text x="62" y="539" fill="#4B5563" font-size="17" font-weight="400" text-anchor="start">Trace calls, denied actions and suspicious output</text><text x="40" y="625" fill="#111827" font-size="22" font-weight="700" text-anchor="start">Defense in depth: every layer assumes the previous layer may have failed.</text></svg>
