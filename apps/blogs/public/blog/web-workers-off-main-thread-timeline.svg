<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7FB"/>
      <stop offset="1" stop-color="#EDEDF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#D97706"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2F5BFF"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#16A34A"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <g opacity="0.45" stroke="#D8D8E8" stroke-width="2">
    <path d="M0 112H1200M0 224H1200M0 336H1200M0 448H1200M0 560H1200"/>
    <path d="M120 0V675M264 0V675M408 0V675M552 0V675M696 0V675M840 0V675M984 0V675M1128 0V675"/>
  </g>

  <text x="40" y="62" fill="#111827" font-size="34" font-weight="800">Main thread vs worker: where the time goes</text>
  <text x="40" y="98" fill="#4B5563" font-size="18">Moving a long task out frees input, but postMessage charges a toll at both ends.</text>

  <!-- Panel A: before -->
  <text x="40" y="148" fill="#DC2626" font-size="18" font-weight="700">Before: everything on the main thread</text>
  <text x="40" y="200" fill="#111827" font-size="18" font-weight="700">Main</text>
  <g filter="url(#shadow)">
    <rect x="150" y="170" width="1010" height="48" rx="12" fill="white" stroke="#E5E7EF" stroke-width="2"/>
  </g>
  <rect x="190" y="170" width="840" height="48" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="610" y="200" text-anchor="middle" fill="#991B1B" font-size="18" font-weight="700">click handler + parse CSV: one 420 ms long task</text>
  <rect x="1040" y="170" width="30" height="48" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/>
  <text x="1082" y="200" fill="#16A34A" font-size="17" font-weight="700">paint</text>

  <path d="M330 266V226" stroke="#D97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowAmber)"/>
  <text x="318" y="264" text-anchor="end" fill="#D97706" font-size="17" font-weight="700">tap</text>
  <path d="M342 246H1034" stroke="#D97706" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round" marker-end="url(#arrowAmber)"/>
  <text x="690" y="272" text-anchor="middle" fill="#D97706" font-size="17" font-weight="600">input waits for the long task to finish → poor INP</text>

  <!-- Panel B: after -->
  <text x="40" y="322" fill="#16A34A" font-size="18" font-weight="700">After: work moved to a worker</text>

  <text x="40" y="376" fill="#111827" font-size="18" font-weight="700">Main</text>
  <g filter="url(#shadow)">
    <rect x="150" y="346" width="1010" height="48" rx="12" fill="white" stroke="#E5E7EF" stroke-width="2"/>
    <rect x="150" y="496" width="1010" height="48" rx="12" fill="white" stroke="#E5E7EF" stroke-width="2"/>
  </g>
  <text x="40" y="526" fill="#111827" font-size="18" font-weight="700">Worker</text>

  <!-- main thread blocks -->
  <rect x="190" y="346" width="24" height="48" rx="6" fill="#DBEAFE" stroke="#2F5BFF" stroke-width="2.5"/>
  <rect x="500" y="346" width="40" height="48" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/>
  <text x="520" y="336" text-anchor="middle" fill="#16A34A" font-size="17" font-weight="700">tap handled, painted</text>
  <text x="722" y="376" text-anchor="middle" fill="#6B7280" font-size="17" font-weight="600">main thread free for input</text>
  <rect x="908" y="346" width="52" height="48" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <rect x="962" y="346" width="48" height="48" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/>
  <text x="960" y="336" text-anchor="middle" fill="#B45309" font-size="17" font-weight="700">receive (clone) + render</text>

  <!-- worker blocks -->
  <rect x="222" y="496" width="14" height="48" rx="4" fill="#DBEAFE" stroke="#2F5BFF" stroke-width="2"/>
  <rect x="240" y="496" width="120" height="48" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
  <rect x="366" y="496" width="120" height="48" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
  <rect x="492" y="496" width="120" height="48" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
  <rect x="618" y="496" width="120" height="48" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
  <rect x="744" y="496" width="136" height="48" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="560" y="572" text-anchor="middle" fill="#5B21B6" font-size="17" font-weight="700">parse in chunks (each yield lets cancel in)</text>
  <rect x="884" y="496" width="22" height="48" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="895" y="570" text-anchor="middle" fill="#B45309" font-size="16" font-weight="600">serialize result</text>

  <!-- transfer in -->
  <path d="M202 396L226 490" stroke="#2F5BFF" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <text x="240" y="444" fill="#2F5BFF" font-size="17" font-weight="700">postMessage(file, [buffer])</text>
  <text x="240" y="468" fill="#4B5563" font-size="16">transfer: ownership moves, no copy</text>

  <!-- clone out -->
  <path d="M900 494L926 400" stroke="#D97706" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowAmber)"/>
  <text x="884" y="444" text-anchor="end" fill="#D97706" font-size="17" font-weight="700">structured clone back</text>
  <text x="884" y="468" text-anchor="end" fill="#4B5563" font-size="16">cost grows with object count and size</text>

  <text x="600" y="620" text-anchor="middle" fill="#111827" font-size="17" font-weight="600">Keep messages small: transfer buffers, send File/Blob by reference, return summaries.</text>
  <text x="600" y="648" text-anchor="middle" fill="#4B5563" font-size="16">Spawn workers once and reuse them: startup and per-worker memory are not free.</text>
</svg>
