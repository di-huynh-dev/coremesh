<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7FB"/>
      <stop offset="1" stop-color="#EDEDF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <g opacity="0.4" stroke="#D8D8E8" stroke-width="2">
    <path d="M0 112H1200M0 224H1200M0 336H1200M0 448H1200M0 560H1200"/>
    <path d="M120 0V675M264 0V675M408 0V675M552 0V675M696 0V675M840 0V675M984 0V675M1128 0V675"/>
  </g>

  <text x="50" y="66" fill="#111827" font-size="34" font-weight="800">Hybrid search: two lists, one ranking</text>

  <!-- Question -->
  <g filter="url(#shadow)">
    <rect x="50" y="285" width="190" height="104" rx="22" fill="white" stroke="#E5E7EF"/>
  </g>
  <text x="145" y="327" text-anchor="middle" fill="#111827" font-size="22" font-weight="700">Question</text>
  <text x="145" y="358" text-anchor="middle" fill="#4B5563" font-size="18">fix VPN-403?</text>

  <!-- ACL frame -->
  <rect x="268" y="98" width="314" height="498" rx="26" stroke="#DC2626" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Full-text list -->
  <g filter="url(#shadow)">
    <rect x="288" y="114" width="274" height="222" rx="22" fill="white" stroke="#E5E7EF"/>
    <rect x="288" y="360" width="274" height="222" rx="22" fill="white" stroke="#E5E7EF"/>
  </g>
  <text x="310" y="150" fill="#111827" font-size="22" font-weight="700">Full-text</text>
  <text x="310" y="176" fill="#4B5563" font-size="18">tsvector · ts_rank_cd</text>
  <g font-size="18" fill="#111827">
    <text x="310" y="218"><tspan fill="#D97706" font-weight="700">1</tspan><tspan x="344">C · VPN-403 runbook</tspan></text>
    <text x="310" y="256"><tspan fill="#D97706" font-weight="700">2</tspan><tspan x="344">D · error codes</tspan></text>
    <text x="310" y="294"><tspan fill="#D97706" font-weight="700">3</tspan><tspan x="344">F · VPN FAQ</tspan></text>
  </g>

  <!-- Vector list -->
  <text x="310" y="396" fill="#111827" font-size="22" font-weight="700">Vector</text>
  <text x="310" y="422" fill="#4B5563" font-size="18">HNSW · cosine</text>
  <g font-size="18" fill="#111827">
    <text x="310" y="464"><tspan fill="#2F5BFF" font-weight="700">1</tspan><tspan x="344">A · VPN setup guide</tspan></text>
    <text x="310" y="502"><tspan fill="#2F5BFF" font-weight="700">2</tspan><tspan x="344">B · VPN overview</tspan></text>
    <text x="310" y="540"><tspan fill="#2F5BFF" font-weight="700">12</tspan><tspan x="344">C · VPN-403 runbook</tspan></text>
  </g>

  <!-- RRF -->
  <g filter="url(#shadow)">
    <rect x="620" y="190" width="230" height="292" rx="22" fill="white" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="642" y="232" fill="#111827" font-size="26" font-weight="800">RRF</text>
  <text x="642" y="262" fill="#4B5563" font-size="18">Σ 1 / (60 + rank)</text>
  <g font-size="20" fill="#111827">
    <text x="642" y="310"><tspan font-weight="700">A</tspan><tspan x="700">0.0320</tspan></text>
    <text x="642" y="350"><tspan font-weight="700" fill="#7C3AED">C</tspan><tspan x="700" fill="#7C3AED">0.0303</tspan></text>
    <text x="642" y="390"><tspan font-weight="700">B</tspan><tspan x="700">0.0161</tspan></text>
    <text x="642" y="430"><tspan font-weight="700">D</tspan><tspan x="700">0.0161</tspan></text>
  </g>

  <!-- Reranker -->
  <g filter="url(#shadow)">
    <rect x="890" y="114" width="250" height="150" rx="22" fill="white" stroke="#E5E7EF"/>
    <rect x="890" y="312" width="250" height="270" rx="22" fill="white" stroke="#16A34A" stroke-width="2"/>
  </g>
  <text x="912" y="156" fill="#111827" font-size="22" font-weight="700">Reranker</text>
  <text x="912" y="186" fill="#4B5563" font-size="18">cross-encoder</text>
  <text x="912" y="214" fill="#4B5563" font-size="18">30 candidates → 8</text>

  <!-- Top context -->
  <text x="912" y="352" fill="#111827" font-size="22" font-weight="700">Top context</text>
  <g font-size="18" fill="#111827">
    <text x="912" y="396"><tspan fill="#16A34A" font-weight="700">1</tspan><tspan x="942">C · VPN-403</tspan></text>
    <text x="912" y="434"><tspan fill="#16A34A" font-weight="700">2</tspan><tspan x="942">A · VPN setup</tspan></text>
    <text x="912" y="472"><tspan fill="#16A34A" font-weight="700">3</tspan><tspan x="942">D · error codes</tspan></text>
  </g>
  <text x="912" y="526" fill="#16A34A" font-size="18" font-weight="700">→ LLM + citations</text>

  <!-- Arrows -->
  <g stroke="#9CA3AF" stroke-width="3" marker-end="url(#a)">
    <path d="M242 318C266 318 262 225 282 225"/>
    <path d="M242 356C266 356 262 470 282 470"/>
    <path d="M564 225C592 225 590 280 614 280"/>
    <path d="M564 470C592 470 590 400 614 400"/>
    <path d="M852 300C872 300 866 190 884 190"/>
    <path d="M1015 266V306"/>
  </g>

  <text x="50" y="634" fill="#DC2626" font-size="20" font-weight="600">Both lists: WHERE tenant_id = $3 AND allowed_groups &amp;&amp; $4</text>
</svg>
