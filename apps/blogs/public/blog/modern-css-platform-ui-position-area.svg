<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7FB"/>
      <stop offset="1" stop-color="#EDEDF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#D97706"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <g opacity="0.45" stroke="#D8D8E8" stroke-width="2">
    <path d="M0 112H1200"/><path d="M0 336H1200"/><path d="M0 560H1200"/>
    <path d="M264 0V675"/><path d="M696 0V675"/><path d="M1128 0V675"/>
  </g>
  <text x="44" y="70" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">position-area: a 3×3 grid around the anchor</text>

  <g filter="url(#shadow)">
    <rect x="40" y="96" width="640" height="560" rx="24" fill="white" stroke="#E5E7EF"/>
  </g>
  <rect x="70" y="126" width="580" height="484" rx="12" fill="#FAFAFD" stroke="#D1D5DB" stroke-width="2"/>
  <g stroke="#C7C7D8" stroke-width="2" stroke-dasharray="8 8">
    <path d="M260 126V610"/><path d="M420 126V610"/>
    <path d="M70 280H650"/><path d="M70 350H650"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#4B5563" text-anchor="middle">
    <text x="165" y="152">top left</text>
    <text x="340" y="152">top center</text>
    <text x="535" y="152">top right</text>
    <text x="165" y="322">center left</text>
    <text x="498" y="322">center right</text>
    <text x="165" y="596">bottom left</text>
    <text x="340" y="596">bottom center</text>
    <text x="535" y="596">bottom right</text>
  </g>

  <rect x="266" y="286" width="148" height="58" rx="12" fill="#2F5BFF"/>
  <text x="340" y="323" text-anchor="middle" fill="white" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">anchor</text>

  <rect x="264" y="164" width="250" height="110" rx="14" fill="#FFFBEB" stroke="#D97706" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="389" y="212" text-anchor="middle" fill="#B45309" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">flip-block</text>
  <text x="389" y="242" text-anchor="middle" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500">top span-right</text>

  <rect x="264" y="358" width="250" height="110" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="3"/>
  <text x="389" y="406" text-anchor="middle" fill="#15803D" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">popover (base)</text>
  <text x="389" y="436" text-anchor="middle" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500">bottom span-right</text>

  <path d="M522 430C632 420 632 230 524 222" stroke="#D97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowAmber)"/>

  <text x="360" y="640" text-anchor="middle" fill="#4B5563" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500">Outer tracks stretch to the viewport edges</text>

  <g filter="url(#shadow)">
    <rect x="710" y="96" width="450" height="560" rx="24" fill="white" stroke="#E5E7EF"/>
  </g>
  <text x="740" y="140" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">position-try-fallbacks</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="735" y="162" width="400" height="74" rx="16" fill="#F0FDF4" stroke="#BBF7D0"/>
    <circle cx="770" cy="199" r="18" fill="#16A34A"/>
    <text x="770" y="206" text-anchor="middle" fill="white" font-size="20" font-weight="700">1</text>
    <text x="802" y="192" fill="#111827" font-size="20" font-weight="700">Base position</text>
    <text x="802" y="220" fill="#4B5563" font-size="18" font-weight="500">bottom span-right</text>

    <rect x="735" y="248" width="400" height="74" rx="16" fill="#FFFBEB" stroke="#FDE68A"/>
    <circle cx="770" cy="285" r="18" fill="#D97706"/>
    <text x="770" y="292" text-anchor="middle" fill="white" font-size="20" font-weight="700">2</text>
    <text x="802" y="278" fill="#111827" font-size="20" font-weight="700">flip-block</text>
    <text x="802" y="306" fill="#4B5563" font-size="18" font-weight="500">top span-right</text>

    <rect x="735" y="334" width="400" height="74" rx="16" fill="#F5F3FF" stroke="#DDD6FE"/>
    <circle cx="770" cy="371" r="18" fill="#7C3AED"/>
    <text x="770" y="378" text-anchor="middle" fill="white" font-size="20" font-weight="700">3</text>
    <text x="802" y="364" fill="#111827" font-size="20" font-weight="700">flip-inline</text>
    <text x="802" y="392" fill="#4B5563" font-size="18" font-weight="500">bottom span-left</text>

    <rect x="735" y="420" width="400" height="74" rx="16" fill="#EFF3FF" stroke="#C7D2FE"/>
    <circle cx="770" cy="457" r="18" fill="#2F5BFF"/>
    <text x="770" y="464" text-anchor="middle" fill="white" font-size="20" font-weight="700">4</text>
    <text x="802" y="450" fill="#111827" font-size="20" font-weight="700">flip-block flip-inline</text>
    <text x="802" y="478" fill="#4B5563" font-size="18" font-weight="500">top span-left</text>

    <text x="740" y="546" fill="#111827" font-size="20" font-weight="700">First option that fits wins.</text>
    <text x="740" y="580" fill="#4B5563" font-size="18" font-weight="500">None fit? It overflows, unless</text>
    <text x="740" y="608" fill="#4B5563" font-size="18" font-weight="500">position-visibility: no-overflow</text>
  </g>
</svg>
