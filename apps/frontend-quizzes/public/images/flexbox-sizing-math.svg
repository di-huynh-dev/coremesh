<svg viewBox="0 0 800 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card -->
  <rect x="2" y="2" width="796" height="356" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Title -->
  <text x="30" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Flex Sizing Math: flex-grow Distribution</text>
  <text x="30" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">How browser calculates final widths (Container: 500px, Item A grow: 1, Item B grow: 2)</text>
  
  <!-- Step 1: Initial Allocation (flex-basis) -->
  <g transform="translate(0, 10)">
    <text x="40" y="95" fill="#eab308" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Step 1: Check flex-basis &amp; Free Space</text>
    <text x="40" y="112" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Sum of bases (100px + 200px = 300px). Remaining space = 200px.</text>
    
    <!-- Container 500px -->
    <rect x="150" y="130" width="500" height="50" rx="6" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Item A (basis 100px) -->
    <rect x="150" y="130" width="100" height="50" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="200" y="160" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Item A</text>
    <text x="200" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">basis: 100px</text>
    
    <!-- Item B (basis 200px) -->
    <rect x="250" y="130" width="200" height="50" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="350" y="160" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Item B</text>
    <text x="350" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">basis: 200px</text>
    
    <!-- Remaining Space 200px -->
    <rect x="450" y="130" width="200" height="50" rx="6" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="550" y="155" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Unallocated Free Space</text>
    <text x="550" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">+200px</text>
  </g>
  
  <!-- Step 2: Space Distribution -->
  <g transform="translate(0, 120)">
    <text x="40" y="105" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Step 2: Distribute Free Space by flex-grow Ratio (1:2)</text>
    <text x="40" y="122" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Item A grow factor (1/3 * 200px = +66.7px). Item B grow factor (2/3 * 200px = +133.3px).</text>
    
    <!-- Container 500px -->
    <rect x="150" y="140" width="500" height="50" rx="6" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Item A (Final width: 166.7px) -->
    <!-- Base Part -->
    <rect x="150" y="140" width="100" height="50" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <!-- Grow Part -->
    <rect x="250" y="140" width="66.7" height="50" rx="4" fill="#0369a1" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1"/>
    <text x="208" y="165" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Item A (166.7px)</text>
    <text x="208" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">100px + 66.7px</text>
    
    <!-- Item B (Final width: 333.3px) -->
    <!-- Base Part -->
    <rect x="316.7" y="140" width="200" height="50" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <!-- Grow Part -->
    <rect x="516.7" y="140" width="133.3" height="50" rx="4" fill="#0369a1" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1"/>
    <text x="483" y="165" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Item B (333.3px)</text>
    <text x="483" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">200px + 133.3px</text>
  </g>
</svg>
