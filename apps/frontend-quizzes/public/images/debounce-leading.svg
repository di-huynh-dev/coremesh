<svg viewBox="0 0 800 240" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect x="2" y="2" width="796" height="236" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Title -->
  <text x="30" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Leading Edge Debounce Timeline (Immediate)</text>
  
  <!-- Time Axis -->
  <line x1="60" y1="140" x2="720" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="730" y="145" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Time</text>
  
  <!-- Event 1 (Triggers Immediate Execution) -->
  <circle cx="100" cy="140" r="8" fill="#eab308"/>
  <circle cx="100" cy="140" r="12" fill="none" stroke="#22c55e" stroke-width="2" filter="url(#glow)"/>
  <text x="100" y="100" fill="#22c55e" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">Immediate Run</text>
  <text x="100" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">1st Click</text>
  
  <!-- Lockout Period starting at Event 1 -->
  <rect x="100" y="155" width="380" height="25" rx="4" fill="#ef4444" fill-opacity="0.1" stroke="#f87171" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="290" y="172" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">Lockout Period (Timer resets with each event)</text>
  
  <!-- Spammed Events inside Lockout -->
  <!-- Event 2 -->
  <circle cx="200" cy="140" r="8" fill="#eab308"/>
  <path d="M 194 134 L 206 146 M 206 134 L 194 146" stroke="#ef4444" stroke-width="2.5"/>
  <text x="200" y="100" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Ignored</text>
  <text x="200" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">2nd Click</text>
  
  <!-- Event 3 -->
  <circle cx="280" cy="140" r="8" fill="#eab308"/>
  <path d="M 274 134 L 286 146 M 286 134 L 274 146" stroke="#ef4444" stroke-width="2.5"/>
  <text x="280" y="100" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Ignored</text>
  <text x="280" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">3rd Click</text>
  
  <!-- Lockout clears -->
  <line x1="480" y1="130" x2="480" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="120" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Lockout Clears</text>
  
  <!-- Event 4 (After lockout) -->
  <circle cx="580" cy="140" r="8" fill="#eab308"/>
  <circle cx="580" cy="140" r="12" fill="none" stroke="#22c55e" stroke-width="2" filter="url(#glow)"/>
  <text x="580" y="100" fill="#22c55e" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">Immediate Run</text>
  <text x="580" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">4th Click</text>

  <!-- Legend -->
  <g transform="translate(560, 25)">
    <circle cx="10" cy="10" r="5" fill="#eab308"/>
    <text x="25" y="13" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Click Event</text>
    
    <circle cx="10" cy="25" r="5" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <text x="25" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Execution Triggered</text>
    
    <path d="M 5 37 L 15 47 M 15 37 L 5 47" stroke="#ef4444" stroke-width="2"/>
    <text x="25" y="43" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Ignored Event</text>
  </g>
</svg>
