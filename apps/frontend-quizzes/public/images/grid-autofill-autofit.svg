<svg viewBox="0 0 800 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card -->
  <rect x="2" y="2" width="796" height="356" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Title -->
  <text x="30" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Responsive Grid: auto-fill vs. auto-fit</text>
  <text x="30" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">How they behave when there are fewer items than can fit on a single row (Container: 600px wide, minmax(150px, 1fr))</text>
  
  <!-- Left Side: auto-fill -->
  <g transform="translate(0, 20)">
    <text x="40" y="85" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">auto-fill</text>
    <text x="40" y="103" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Fills row with empty tracks. Items do NOT stretch to fill extra space.</text>
    
    <!-- Container Outline (350px wide) -->
    <rect x="40" y="125" width="330" height="110" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="50" y="142" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">container: 600px</text>
    
    <!-- Item 1 -->
    <rect x="50" y="155" width="100" height="65" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="100" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Item 1</text>
    <text x="100" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">150px (min)</text>
    
    <!-- Item 2 -->
    <rect x="155" y="155" width="100" height="65" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="205" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Item 2</text>
    <text x="205" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">150px (min)</text>
    
    <!-- Empty columns / tracks -->
    <rect x="260" y="155" width="100" height="65" rx="6" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="310" y="185" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Empty Track</text>
    <text x="310" y="200" fill="#475569" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">150px</text>
    
    <!-- Brackets/Labels -->
    <path d="M 50 242 L 50 250 L 255 250 L 255 242" fill="none" stroke="#64748b" stroke-width="1"/>
    <text x="152.5" y="265" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Items remain at minimum width</text>
  </g>
  
  <!-- Middle Divider -->
  <line x1="400" y1="95" x2="400" y2="330" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Right Side: auto-fit -->
  <g transform="translate(0, 20)">
    <text x="430" y="85" fill="#eab308" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">auto-fit</text>
    <text x="430" y="103" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Collapses empty tracks. Active items stretch to fill row width.</text>
    
    <!-- Container Outline (350px wide) -->
    <rect x="430" y="125" width="330" height="110" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="440" y="142" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">container: 600px</text>
    
    <!-- Item 1 (stretched) -->
    <rect x="440" y="155" width="150" height="65" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <text x="515" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Item 1</text>
    <text x="515" y="200" fill="#eab308" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">300px (Stretched)</text>
    
    <!-- Item 2 (stretched) -->
    <rect x="595" y="155" width="155" height="65" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <text x="672.5" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Item 2</text>
    <text x="672.5" y="200" fill="#eab308" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">300px (Stretched)</text>
    
    <!-- Indicator for collapsed column -->
    <line x1="752" y1="155" x2="752" y2="220" stroke="#f43f5e" stroke-width="2" stroke-dasharray="2 2"/>
    <text x="748" y="150" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="9" text-anchor="end" font-weight="bold">Collapsed Track (0px)</text>
    
    <!-- Brackets/Labels -->
    <path d="M 440 242 L 440 250 L 750 250 L 750 242" fill="none" stroke="#64748b" stroke-width="1"/>
    <text x="595" y="265" fill="#eab308" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Items stretch to distribute remaining space</text>
  </g>
</svg>
