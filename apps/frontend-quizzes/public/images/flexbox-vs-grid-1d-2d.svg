<svg viewBox="0 0 800 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card -->
  <rect x="2" y="2" width="796" height="356" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Title -->
  <text x="30" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Dimensionality: Flexbox (1D) vs. CSS Grid (2D)</text>
  <text x="30" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Flexbox aligns items row-by-row; Grid aligns across both dimensions simultaneously.</text>
  
  <!-- Left Side: Flexbox (1D) -->
  <g transform="translate(0, 20)">
    <!-- Subtitle -->
    <text x="40" y="80" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Flexbox (Row Wrap)</text>
    <text x="40" y="98" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Rows are independent. Wrap behaves as a new 1D flow.</text>
    
    <!-- Row 1 -->
    <rect x="40" y="120" width="100" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="147" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Item 1</text>
    
    <rect x="150" y="120" width="150" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="225" y="147" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Item 2 (longer)</text>
    
    <rect x="310" y="120" width="60" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="340" y="147" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Item 3</text>
    
    <!-- Row 2 -->
    <rect x="40" y="180" width="180" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="130" y="207" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Item 4 (wrapped)</text>
    
    <rect x="230" y="180" width="140" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="300" y="207" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Item 5</text>
    
    <!-- Misalignment Guidelines -->
    <line x1="150" y1="120" x2="150" y2="240" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="230" y1="180" x2="230" y2="240" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="190" y="260" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">No vertical alignment</text>
  </g>
  
  <!-- Middle Divider -->
  <line x1="400" y1="90" x2="400" y2="330" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Right Side: CSS Grid (2D) -->
  <g transform="translate(0, 20)">
    <!-- Subtitle -->
    <text x="430" y="80" fill="#eab308" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">CSS Grid (2D Columns &amp; Rows)</text>
    <text x="430" y="98" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Strict grid lines enforce alignment in both dimensions.</text>
    
    <!-- Row 1 -->
    <rect x="430" y="120" width="100" height="45" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <text x="480" y="147" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Item 1</text>
    
    <rect x="540" y="120" width="150" height="45" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <text x="615" y="147" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Item 2</text>
    
    <rect x="700" y="120" width="60" height="45" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <text x="730" y="147" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Item 3</text>
    
    <!-- Row 2 -->
    <rect x="430" y="180" width="100" height="45" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <text x="480" y="207" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Item 4</text>
    
    <rect x="540" y="180" width="150" height="45" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <text x="615" y="207" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Item 5</text>
    
    <rect x="700" y="180" width="60" height="45" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <text x="730" y="207" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Item 6</text>
    
    <!-- Alignment Guidelines (Grid Tracks) -->
    <line x1="535" y1="110" x2="535" y2="240" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="695" y1="110" x2="695" y2="240" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="615" y="260" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">Aligned Column Tracks</text>
  </g>
</svg>
