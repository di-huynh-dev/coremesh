<svg viewBox="0 0 800 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card -->
  <rect x="2" y="2" width="796" height="356" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Title -->
  <text x="30" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Flexbox: Main Axis vs. Cross Axis</text>
  <text x="30" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">The orientation of the axes swaps depending on the flex-direction property.</text>
  
  <!-- Defs for markers (arrows) -->
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#eab308"/>
    </marker>
  </defs>

  <!-- Left Column: Row Direction -->
  <g transform="translate(0, 20)">
    <text x="40" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">flex-direction: row</text>
    <text x="40" y="98" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Default alignment. Main axis is horizontal.</text>
    
    <!-- Row Container -->
    <rect x="40" y="130" width="310" height="110" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Items inside -->
    <rect x="55" y="160" width="65" height="50" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="87.5" y="190" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Item 1</text>
    
    <rect x="135" y="160" width="65" height="50" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="167.5" y="190" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Item 2</text>
    
    <rect x="215" y="160" width="65" height="50" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="247.5" y="190" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Item 3</text>
    
    <!-- Main Axis Arrow (Horizontal) -->
    <line x1="40" y1="265" x2="350" y2="265" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="195" y="285" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Main Axis (justify-content)</text>
    
    <!-- Cross Axis Arrow (Vertical) -->
    <line x1="375" y1="130" x2="375" y2="240" stroke="#eab308" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
    <text x="390" y="190" fill="#eab308" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(90, 390, 190)">Cross Axis (align-items)</text>
  </g>
  
  <!-- Right Column: Column Direction -->
  <g transform="translate(420, 20)">
    <text x="40" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">flex-direction: column</text>
    <text x="40" y="98" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Main axis is vertical. Cross axis is horizontal.</text>
    
    <!-- Column Container -->
    <rect x="40" y="120" width="160" height="150" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Items inside -->
    <rect x="65" y="135" width="110" height="40" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="120" y="160" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Item 1</text>
    
    <rect x="65" y="190" width="110" height="40" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="120" y="215" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Item 2</text>
    
    <!-- Main Axis Arrow (Vertical) -->
    <line x1="225" y1="120" x2="225" y2="270" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="240" y="195" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(90, 240, 195)">Main Axis (justify-content)</text>
    
    <!-- Cross Axis Arrow (Horizontal) -->
    <line x1="40" y1="295" x2="200" y2="295" stroke="#eab308" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
    <text x="120" y="315" fill="#eab308" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cross Axis (align-items)</text>
  </g>
</svg>
