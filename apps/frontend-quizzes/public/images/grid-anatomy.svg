<svg viewBox="0 0 800 380" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card -->
  <rect x="2" y="2" width="796" height="376" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Title -->
  <text x="30" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Anatomy of CSS Grid Layout</text>
  <text x="30" y="53" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Understanding lines, tracks, cells, and areas in a 2D grid structure.</text>
  
  <!-- Definitions Legend -->
  <g transform="translate(640, 75)" font-family="system-ui, sans-serif" font-size="11">
    <rect x="0" y="0" width="130" height="260" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
    <text x="15" y="25" fill="#f8fafc" font-weight="bold" font-size="12">Key Terms</text>
    
    <rect x="15" y="45" width="15" height="15" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="38" y="57" fill="#94a3b8">Grid Cell</text>
    
    <rect x="15" y="75" width="15" height="15" rx="3" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <text x="38" y="87" fill="#94a3b8">Grid Area</text>
    
    <line x1="15" y1="120" x2="30" y2="120" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="38" y="123" fill="#94a3b8">Grid Line</text>
    
    <path d="M 15 150 L 30 150" stroke="#38bdf8" stroke-width="2"/>
    <text x="38" y="153" fill="#94a3b8">Grid Track</text>
  </g>

  <!-- Grid Container -->
  <rect x="120" y="100" width="480" height="200" rx="8" fill="#111827" stroke="#374151" stroke-width="2"/>
  
  <!-- GRID CELLS & ITEMS -->
  <!-- Row 1, Col 1: Grid Cell -->
  <rect x="125" y="105" width="150" height="90" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="200" y="155" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Grid Cell</text>
  
  <!-- Row 1, Col 2 & 3: Grid Area (Spanning) -->
  <rect x="285" y="105" width="310" height="90" rx="6" fill="#065f46" fill-opacity="0.6" stroke="#10b981" stroke-width="2"/>
  <text x="440" y="155" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Grid Area (Spans Columns 2 to 4)</text>
  
  <!-- Row 2, Col 1: Empty Track Cell (dotted) -->
  <rect x="125" y="205" width="150" height="90" rx="6" fill="#111827" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="200" y="255" fill="#4b5563" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Empty Cell</text>
  
  <!-- Row 2, Col 2: Grid Item -->
  <rect x="285" y="205" width="150" height="90" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
  <text x="360" y="255" fill="#fef08a" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Grid Item</text>

  <!-- Row 2, Col 3: Empty Cell -->
  <rect x="445" y="205" width="150" height="90" rx="6" fill="#111827" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
  
  <!-- GRID LINES (Vertical / Columns) -->
  <!-- Line 1 -->
  <line x1="120" y1="80" x2="120" y2="315" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="120" y="72" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">Line 1</text>
  
  <!-- Line 2 -->
  <line x1="280" y1="80" x2="280" y2="315" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="280" y="72" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">Line 2</text>
  
  <!-- Line 3 -->
  <line x1="440" y1="80" x2="440" y2="315" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="440" y="72" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">Line 3</text>
  
  <!-- Line 4 -->
  <line x1="600" y1="80" x2="600" y2="315" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="600" y="72" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">Line 4</text>
  
  <!-- GRID LINES (Horizontal / Rows) -->
  <!-- Line 1 -->
  <line x1="90" y1="100" x2="615" y2="100" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="82" y="104" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" font-weight="bold">Line 1</text>
  
  <!-- Line 2 -->
  <line x1="90" y1="200" x2="615" y2="200" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="82" y="204" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" font-weight="bold">Line 2</text>
  
  <!-- Line 3 -->
  <line x1="90" y1="300" x2="615" y2="300" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="82" y="304" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" font-weight="bold">Line 3</text>

  <!-- GRID TRACKS -->
  <!-- Column Track Bracket (top) -->
  <path d="M 445 325 L 445 333 L 595 333 L 595 325" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="520" y="350" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">Grid Track (Column)</text>

  <!-- Row Track Bracket (left) -->
  <path d="M 50 205 L 42 205 L 42 295 L 50 295" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="30" y="254" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" transform="rotate(-90, 30, 254)">Grid Track (Row)</text>
</svg>
