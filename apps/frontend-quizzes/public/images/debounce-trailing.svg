<svg viewBox="0 0 800 240" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect x="2" y="2" width="796" height="236" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Title -->
  <text x="30" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Trailing Edge Debounce Timeline (Standard)</text>
  
  <!-- Time Axis -->
  <line x1="60" y1="140" x2="720" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="730" y="145" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Time</text>
  
  <!-- Keystroke Events Group -->
  <!-- Event 1 -->
  <circle cx="100" cy="140" r="8" fill="#eab308"/>
  <line x1="100" y1="140" x2="100" y2="100" stroke="#eab308" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- Event 2 -->
  <circle cx="140" cy="140" r="8" fill="#eab308"/>
  <line x1="140" y1="140" x2="140" y2="100" stroke="#eab308" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- Event 3 -->
  <circle cx="180" cy="140" r="8" fill="#eab308"/>
  <line x1="180" y1="140" x2="180" y2="100" stroke="#eab308" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- Event 4 (Last Event) -->
  <circle cx="220" cy="140" r="8" fill="#eab308"/>
  <line x1="220" y1="140" x2="220" y2="100" stroke="#eab308" stroke-width="1.5" stroke-dasharray="2 2"/>
  
  <text x="160" y="80" fill="#eab308" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">Rapid Keystrokes</text>
  
  <!-- Delay bracket/timer -->
  <path d="M 220 160 L 220 180 L 420 180 L 420 160" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="320" y="200" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">Delay Window (300ms)</text>
  <text x="320" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">No new events occur</text>
  
  <!-- Execution -->
  <circle cx="420" cy="140" r="10" fill="#0ea5e9" filter="url(#glow)"/>
  <text x="420" y="115" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">Execution</text>
  <text x="420" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Function runs</text>
  
  <!-- Legend -->
  <g transform="translate(560, 30)">
    <circle cx="10" cy="10" r="6" fill="#eab308"/>
    <text x="25" y="14" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Keystroke Event</text>
    
    <circle cx="10" cy="30" r="6" fill="#0ea5e9"/>
    <text x="25" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Function Executed</text>
  </g>
</svg>
