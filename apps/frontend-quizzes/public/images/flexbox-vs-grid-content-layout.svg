<svg viewBox="0 0 800 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Card -->
  <rect x="2" y="2" width="796" height="356" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Title -->
  <text x="30" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Design Philosophy: Content-First vs. Layout-First</text>
  <text x="30" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Flexbox sizes items dynamically based on content. CSS Grid sets a rigid layout template first.</text>
  
  <!-- Left Side: Flexbox (Content-First) -->
  <g transform="translate(0, 20)">
    <!-- Subtitle -->
    <text x="40" y="80" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Flexbox: Content-First</text>
    <text x="40" y="98" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Widths automatically adjust to the item's content sizing.</text>
    
    <!-- Flex Container Outline -->
    <rect x="40" y="120" width="330" height="110" rx="8" fill="#0b0f19" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="50" y="140" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">flex container</text>
    
    <!-- Item 1 (Short text) -->
    <rect x="50" y="155" width="65" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="82.5" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Short</text>
    
    <!-- Item 2 (Long text) -->
    <rect x="123" y="155" width="180" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="213" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Much More Text Content</text>
    
    <!-- Item 3 (Medium text) -->
    <rect x="310" y="155" width="50" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="335" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">End</text>
    
    <!-- Dynamic Brackets -->
    <path d="M 50 240 L 50 248 L 115 248 L 115 240" fill="none" stroke="#64748b" stroke-width="1"/>
    <path d="M 123 240 L 123 248 L 303 248 L 303 240" fill="none" stroke="#64748b" stroke-width="1"/>
    <path d="M 310 240 L 310 248 L 360 248 L 360 240" fill="none" stroke="#64748b" stroke-width="1"/>
    <text x="205" y="270" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Item widths dictated by content length</text>
  </g>
  
  <!-- Middle Divider -->
  <line x1="400" y1="90" x2="400" y2="330" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Right Side: CSS Grid (Layout-First) -->
  <g transform="translate(0, 20)">
    <!-- Subtitle -->
    <text x="430" y="80" fill="#eab308" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">CSS Grid: Layout-First</text>
    <text x="430" y="98" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Pre-defined grid tracks restrict and govern item widths.</text>
    
    <!-- Grid Container Outline -->
    <rect x="430" y="120" width="330" height="110" rx="8" fill="#0b0f19" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="440" y="140" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">grid container (repeat(3, 1fr))</text>
    
    <!-- Background Track Guidelines -->
    <line x1="536" y1="120" x2="536" y2="230" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="653" y1="120" x2="653" y2="230" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
    
    <!-- Item 1 (Short text, placed in 1fr track) -->
    <rect x="440" y="155" width="86" height="50" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <text x="483" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Short</text>
    
    <!-- Item 2 (Long text, wrapped/truncated inside 1fr track) -->
    <rect x="546" y="155" width="97" height="50" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <text x="594.5" y="178" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Much More</text>
    <text x="594.5" y="194" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Text...</text>
    
    <!-- Item 3 (Medium text, placed in 1fr track) -->
    <rect x="663" y="155" width="87" height="50" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <text x="706.5" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">End</text>
    
    <!-- Static Track Indicators -->
    <path d="M 440 240 L 440 248 L 750 248 L 750 240" fill="none" stroke="#64748b" stroke-width="1"/>
    <line x1="543" y1="240" x2="543" y2="248" stroke="#64748b" stroke-width="1"/>
    <line x1="650" y1="240" x2="650" y2="248" stroke="#64748b" stroke-width="1"/>
    
    <text x="491.5" y="263" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">1fr (100px)</text>
    <text x="596.5" y="263" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">1fr (100px)</text>
    <text x="700" y="263" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">1fr (100px)</text>
    
    <text x="595" y="285" fill="#eab308" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Equal columns defined before items are placed</text>
  </g>
</svg>
